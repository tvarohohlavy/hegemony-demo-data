#
# FRR router remediation playbook for the "IaC: Ansible router drift
# remediation" flow. The routers' SSH login shell is vtysh, so every raw
# command string is executed by `vtysh -c` on the router — the python-free
# pattern real network fleets use. Embedded newlines in one raw block become
# sequential vtysh commands, exactly like pasting into the CLI. The flow's
# while-loop re-audits with netcli after this play and iterates until the
# running config carries the golden loopback description.
- name: Meridian router golden-config remediation
  hosts: all
  gather_facts: false
  tasks:
    - name: Stamp the golden loopback description
      ansible.builtin.raw: |
        configure terminal
        interface lo
        description managed by Meridian NetOps
        end
      changed_when: true

    - name: Read back the running config
      # This FRR build has no per-interface running-config filter — read the
      # whole config and assert on the marker line.
      ansible.builtin.raw: |
        show running-config
      register: lo_config
      changed_when: false

    - name: Assert the description is present
      ansible.builtin.assert:
        that:
          - "'managed by Meridian NetOps' in lo_config.stdout"
        success_msg: "{{ inventory_hostname }} carries the golden description."
        fail_msg: "{{ inventory_hostname }} still lacks the golden description."
