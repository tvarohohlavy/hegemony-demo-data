# A shared object-storage repository for golden artifacts — approved images,
# baseline configs, signed firmware — published once by Meridian and readable
# by every org through the shared read-through. It points at the demo MinIO
# service (S3-compatible) that the demo stack already runs; the bucket is
# created by the stack's minio-init via HEGEMONY_S3_EXTRA_BUCKETS in the
# platform's .env.demo. Tenants see it flagged "Shared" and read-only in the
# file-repository browser.
#
# The `files` entries are metadata-only catalog rows for golden artifacts:
# each names its source via `seed_file`; the build computes
# filename/sha256/size_bytes and copies the source into
# dist/seed-s3/meridian-golden/<object_key>, which the platform demo overlay
# mounts into minio-init so the bucket bytes and the catalog always agree.

schema_version: 2

file_repositories:
  - name: Golden Artifacts
    kind: s3
    endpoint_url: http://minio:9000
    bucket: meridian-golden
    prefix: standards
    is_default: false
    files:
      - seed_file: src/files/standards/golden/baseline-config.txt
        object_key: standards/golden/baseline-config.txt
        folder_path: golden
        content_type: text/plain
      - seed_file: src/files/standards/golden/ntp-dns-baseline.cfg
        object_key: standards/golden/ntp-dns-baseline.cfg
        folder_path: golden
        content_type: text/plain
      - seed_file: src/files/standards/golden/cat9k-demo-17.9.4.bin
        object_key: standards/golden/cat9k-demo-17.9.4.bin
        folder_path: golden
        content_type: application/octet-stream
