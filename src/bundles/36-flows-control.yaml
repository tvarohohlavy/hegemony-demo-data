# Control-flow demo flows: loops, run-scoped variables and branch routing on
# the same lab routers the ops flows target.
#
#  * "Net: Wait for OSPF convergence" is a retry-until-healthy pattern: an
#    UNTIL loop re-collects OSPF neighbor state each iteration; two Set
#    Variables nodes record the verdict and count attempts in
#    {{ run.vars.* }}; a Branch after the loop routes on how many attempts
#    convergence took. The max_iterations exit is wired to a failure terminal.
#  * "Net: Per-prefix route audit" is a FOR-EACH loop over a launch-form list
#    of prefixes: the body runs "show ip route {{ loop.item }}" per prefix
#    (loop context templating into step params), asserts the route is present,
#    and counts audited/missing prefixes in run.vars. The loop collects each
#    audited prefix and a branch after the loop routes on whether any prefix
#    was missing.
#
# Both loops render as container frames in the editor (body nodes are
# scope_id children wired start → … → end inside the frame), and both keep
# their run-scoped variables visible on the Run detail page.

schema_version: 2

flows:
  - name: "Net: Wait for OSPF convergence"
    description: >-
      Retry-until-healthy: collect OSPF neighbor state from the selected
      routers in a loop until every adjacency is Full (or give up after 10
      attempts, 5s apart). Run-scoped variables track the attempt count and
      verdict; a
      branch after the loop reports whether the fabric was converged on the
      first check or needed retries.
    definition:
      graph:
        nodes:
          - id: start
            name: Start
            type: start
            position_x: 0
            position_y: 300
          - id: sv_init
            name: Init counters
            type: set_vars
            position_x: 200
            position_y: 300
            assignments:
              - name: attempts
                expr: "0"
              - name: converged
                expr: "false"
          - id: conv_loop
            name: Until converged
            type: loop
            loop_mode: until
            condition: "run.vars.converged | default(false)"
            max_iterations: 10
            # Pace the poll: wait between re-checks instead of hammering the
            # routers — 10 attempts x 5s rides out OSPF adjacency formation.
            iteration_delay_sec: 5
            position_x: 620
            position_y: 80
            width: 1260
            height: 460
          - id: collect_state
            name: Collect OSPF neighbors
            type: step
            kind: CHECK
            phase: VERIFY
            handler: netcli.collect_evidence
            scope_id: conv_loop
            position_x: 60
            position_y: 100
            target_selectors:
              - type: role
                role: converge_targets
            params:
              commands:
                - show ip ospf neighbor
            policy:
              timeout_sec: 120
              retries: 0
              on_failure: CONTINUE
              evidence_required: true
          - id: assert_full
            name: All adjacencies Full?
            type: step
            kind: CHECK
            phase: VERIFY
            handler: evidence.assert
            scope_id: conv_loop
            position_x: 440
            position_y: 100
            params:
              artifact_step_id: collect_state
              target_role: converge_targets
              command: show ip ospf neighbor
              # Line scope: EVERY neighbor row must say Full — a whole-output
              # "contains Full" would pass with one healthy adjacency among
              # broken ones. The filter selects the rows (they start with the
              # Neighbor ID address) and min_lines rejects an empty table.
              operator: contains
              expected: Full
              match_scope: lines
              line_filter: '^\s*\d+\.\d+\.\d+\.\d+'
              min_lines: 1
              message: At least one router has a non-Full (or no) OSPF neighbor.
            policy:
              timeout_sec: 60
              retries: 0
              on_failure: CONTINUE
              evidence_required: false
          - id: sv_ok
            name: Mark converged
            type: set_vars
            scope_id: conv_loop
            position_x: 820
            position_y: 60
            assignments:
              - name: attempts
                expr: "(run.vars.attempts | default(0) | int) + 1"
              - name: converged
                expr: "true"
          - id: sv_retry
            name: Mark not converged
            type: set_vars
            scope_id: conv_loop
            position_x: 820
            position_y: 260
            assignments:
              - name: attempts
                expr: "(run.vars.attempts | default(0) | int) + 1"
              - name: converged
                expr: "false"
          - id: conv_loop_end
            name: Loop End
            type: loop_end
            loop_ref: conv_loop
            scope_id: conv_loop
            position_x: 1182
            position_y: 426
          - id: verdict
            name: How fast did we converge?
            type: branch
            branch_mode: rules
            position_x: 2000
            position_y: 280
            cases:
              - id: c_first
                label: Converged on first check
                when: "run.vars.attempts | int <= 1"
          - id: done_first
            name: Healthy (first check)
            type: terminal
            terminal_status: success
            position_x: 2360
            position_y: 180
          - id: done_retry
            name: Converged after retries
            type: terminal
            terminal_status: success
            position_x: 2360
            position_y: 320
          - id: not_converged
            name: Did not converge
            type: terminal
            terminal_status: failure
            position_x: 2000
            position_y: 560
        edges:
          - id: e_start_init
            source: start:start
            target: sv_init
          - id: e_init_loop
            source: sv_init:success
            target: conv_loop
          - id: e_loop_collect
            source: conv_loop:iterate
            target: collect_state
          - id: e_collect_assert
            source: collect_state:success
            target: assert_full
          - id: e_collect_retry
            source: collect_state:failure
            target: sv_retry
          - id: e_assert_ok
            source: assert_full:success
            target: sv_ok
          - id: e_assert_retry
            source: assert_full:failure
            target: sv_retry
          - id: e_ok_end
            source: sv_ok:success
            target: conv_loop_end
          - id: e_retry_end
            source: sv_retry:success
            target: conv_loop_end
          - id: e_loop_verdict
            source: conv_loop:done
            target: verdict
          - id: e_loop_giveup
            source: conv_loop:max_iterations
            target: not_converged
          - id: e_verdict_first
            source: verdict:case:c_first
            target: done_first
          - id: e_verdict_retry
            source: verdict:else
            target: done_retry
      interface_graph:
        nodes:
          - id: sec_targets
            kind: section
            position_x: 80
            position_y: 80
            width: 480
            height: 180
            data:
              label: Target routers
              runtime_layout: card
              collapsible: false
          - id: f_targets
            kind: field
            parent_id: sec_targets
            position_x: 40
            position_y: 60
            data:
              label: Routers
              field_id: targets
              field_type: inventory.device
              required: true
              description: >-
                Routers whose OSPF adjacencies must all be Full — the core
                fabric, preselected.
              default_value:
                - dc1-core-01
                - dc1-core-02
                - dc2-core-01
                - dc2-core-02
              config:
                role: converge_targets
                multiple: true
                option_source:
                  kind: inventory.devices
        edges: []

  - name: "Net: Per-prefix route audit"
    description: >-
      For each prefix chosen on the launch form, run "show ip route <prefix>"
      on the selected routers, record the output as evidence, and assert the
      route is actually present — one loop iteration (and one StepRun) per
      prefix, with audited/missing counts kept in run.vars. The loop collects
      each audited prefix and a branch after the loop reports success only
      when nothing was missing. Demonstrates the for-each loop, loop.item
      templating, collect, and a post-loop verdict branch.
    definition:
      graph:
        nodes:
          - id: start
            name: Start
            type: start
            position_x: 0
            position_y: 280
          - id: sv_zero
            name: Reset audit counters
            type: set_vars
            position_x: 200
            position_y: 280
            assignments:
              - name: audited
                expr: "0"
              - name: missing
                expr: "0"
          - id: prefix_loop
            name: For each prefix
            type: loop
            loop_mode: for_each
            items_expr: "inputs.check_prefixes"
            collect: "loop.item"
            position_x: 620
            position_y: 60
            width: 1260
            height: 460
          - id: check_route
            name: Per-prefix route lookup
            type: step
            kind: CHECK
            phase: VERIFY
            handler: netcli.collect_evidence
            scope_id: prefix_loop
            position_x: 60
            position_y: 100
            target_selectors:
              - type: role
                role: audit_targets
            params:
              commands:
                - "show ip route {{ loop.item }}"
            policy:
              timeout_sec: 120
              retries: 0
              on_failure: CONTINUE
              evidence_required: true
          - id: route_ok
            name: Route present?
            type: step
            kind: CHECK
            phase: VERIFY
            handler: evidence.assert
            scope_id: prefix_loop
            position_x: 440
            position_y: 100
            params:
              artifact_step_id: check_route
              target_role: audit_targets
              command: "show ip route {{ loop.item }}"
              # Line scope: the routing entry must exist AND be for the queried
              # prefix — "% Network not in table" selects zero lines and fails
              # via min_lines instead of sneaking past a bare presence check.
              operator: contains
              expected: "{{ loop.item }}"
              match_scope: lines
              line_filter: "^Routing entry for "
              min_lines: 1
              message: "A router has no routing entry for {{ loop.item }}."
            policy:
              timeout_sec: 60
              retries: 0
              on_failure: CONTINUE
              evidence_required: false
          - id: sv_found
            name: Count audited
            type: set_vars
            scope_id: prefix_loop
            position_x: 820
            position_y: 60
            assignments:
              - name: audited
                expr: "(run.vars.audited | default(0) | int) + 1"
          - id: sv_gap
            name: Count missing
            type: set_vars
            scope_id: prefix_loop
            position_x: 820
            position_y: 260
            assignments:
              - name: audited
                expr: "(run.vars.audited | default(0) | int) + 1"
              - name: missing
                expr: "(run.vars.missing | default(0) | int) + 1"
          - id: prefix_loop_end
            name: Loop End
            type: loop_end
            loop_ref: prefix_loop
            scope_id: prefix_loop
            position_x: 1182
            position_y: 426
          - id: audit_verdict
            name: Any prefix missing?
            type: branch
            branch_mode: rules
            position_x: 2000
            position_y: 260
            cases:
              - id: c_clean
                label: All prefixes present
                # audited > 0 guards the vacuous case: an empty prefix
                # selection runs zero iterations and must not report success.
                when: >-
                  (run.vars.missing | default(0) | int) == 0 and
                  (run.vars.audited | default(0) | int) > 0
          - id: audit_done
            name: All prefixes present
            type: terminal
            terminal_status: success
            position_x: 2360
            position_y: 160
          - id: audit_gaps
            name: Prefixes missing
            type: terminal
            terminal_status: failure
            position_x: 2360
            position_y: 340
        edges:
          - id: e_start_zero
            source: start:start
            target: sv_zero
          - id: e_zero_loop
            source: sv_zero:success
            target: prefix_loop
          - id: e_loop_check
            source: prefix_loop:iterate
            target: check_route
          - id: e_check_assert
            source: check_route:success
            target: route_ok
          # An unreachable router counts as a gap and the audit continues.
          - id: e_check_gap
            source: check_route:failure
            target: sv_gap
          - id: e_assert_found
            source: route_ok:success
            target: sv_found
          - id: e_assert_gap
            source: route_ok:failure
            target: sv_gap
          - id: e_found_end
            source: sv_found:success
            target: prefix_loop_end
          - id: e_gap_end
            source: sv_gap:success
            target: prefix_loop_end
          - id: e_loop_verdict
            source: prefix_loop:done
            target: audit_verdict
          - id: e_verdict_clean
            source: "audit_verdict:case:c_clean"
            target: audit_done
          - id: e_verdict_gaps
            source: audit_verdict:else
            target: audit_gaps
      interface_graph:
        nodes:
          - id: sec_targets
            kind: section
            position_x: 80
            position_y: 80
            width: 480
            height: 180
            data:
              label: Target routers
              runtime_layout: card
              collapsible: false
          - id: f_targets
            kind: field
            parent_id: sec_targets
            position_x: 40
            position_y: 60
            data:
              label: Routers
              field_id: targets
              field_type: inventory.device
              required: true
              description: Routers to audit the prefixes on — core routers preselected.
              default_value:
                - dc1-core-01
                - dc2-core-01
              config:
                role: audit_targets
                multiple: true
                option_source:
                  kind: inventory.devices
          - id: sec_prefixes
            kind: section
            position_x: 620
            position_y: 80
            width: 520
            height: 220
            data:
              label: Prefixes
              runtime_layout: card
              collapsible: false
          - id: f_prefixes
            kind: field
            parent_id: sec_prefixes
            position_x: 40
            position_y: 60
            data:
              label: Prefixes to audit
              field_id: check_prefixes
              field_type: core.multi_enum
              required: true
              default_value:
                - "10.101.1.0/24"
                - "10.104.1.0/24"
                - "10.255.255.1/32"
              description: One loop iteration audits each selected prefix.
              config:
                multiple: true
                option_source:
                  kind: core.static
                  static_options:
                    - value: "10.101.1.0/24"
                      label: Lab DC1 endpoint LAN
                    - value: "10.104.1.0/24"
                      label: Lab DC2 endpoint LAN
                    - value: "10.102.1.0/24"
                      label: Lab Branch 1 endpoint LAN
                    - value: "10.103.1.0/24"
                      label: Lab Branch 2 endpoint LAN
                    - value: "10.255.255.1/32"
                      label: dc1-core-01 loopback
                    - value: "10.255.255.9/32"
                      label: dc2-core-01 loopback
        edges: []
