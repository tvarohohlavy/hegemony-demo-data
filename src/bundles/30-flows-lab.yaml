# A single long-running lifecycle flow for the self-contained demo datacenter.
# It builds the lab images (FRR+sshd routers, Alpine+sshd endpoint hosts),
# deploys an 11-router / 4-host multi-area OSPF lab (two datacenters + two
# branches, see src/files/lab/topology.clab.yml) with fixed management
# addresses, deploys the lab bastion next to it (the lab lives inside the
# platform's dind sandbox daemon; workers reach it only through the
# bastion — SSH sessions ProxyJump via dind:2222 and TCP probes use the
# authenticated SOCKS5 listener on dind:1080 — so the seeded inventory
# becomes reachable with no host routing at all), and optionally
# stands up a local Gitea for config backups. It then PARKS on an approval
# gate WITH NO EXPIRY: the run stays paused — the lab keeps running in the
# sandbox — while you SSH to the routers and exercise the other flows
# against them. Approving the gate tears the lab down; rejecting leaves it
# running. This is the flow that administers the sandbox daemon, and a good
# example of a run that stays open for hours or days.

schema_version: 2

flows:
  - name: "Lab: Provision and tear down demo datacenter"
    description: >-
      Build the lab images, deploy the multi-area OSPF lab (11 routers and 4
      Linux endpoint hosts across dc1, dc2 and two branches), deploy the lab
      bastion the workers tunnel through — SSH ProxyJump and authenticated
      SOCKS5 via meridian-bastion (the lab runs inside the platform's dind
      sandbox) — and optionally stand up Gitea; then hold at an approval gate
      (no expiry) so you can interact with the lab. Approve to tear it down,
      reject to leave it running.
    definition:
      # Only one lab may exist at a time: this flow drives the host Docker
      # daemon and deploys a topology on fixed management addresses, so a
      # second concurrent run would fight the first over images, container
      # names and IP addresses. Note that the run parks on an approval gate
      # with no expiry, and a parked run still holds its slot — which is
      # exactly right here: the lab stays occupied until you approve the
      # teardown. The cooldown keeps an accidental double-click from racing a
      # rebuild against a teardown.
      run_limits:
        max_concurrent_runs: 1
        cooldown_seconds: 60
      graph:
        nodes:
          - id: start
            name: Start
            type: start
            position_x: 0
            position_y: 280
          - id: build_image
            name: Build lab images
            type: step
            kind: EXECUTE
            phase: PREPARE
            handler: container.run
            position_x: 240
            position_y: 280
            mounted_files:
              - Dockerfile
              - entrypoint.sh
              - host/
            params:
              image: ghcr.io/srl-labs/clab:0.77.0
              working_dir: /tmp/meridian-lab
              attach_docker_socket: true
              network_mode: host
              timeout_seconds: 600
              env:
                # Single source of truth for the router login: the same vault
                # secret the inventory provider hands to netcli.
                LAB_PASSWORD: "{{ secret('vault://orgs/default/secrets/meridian/lab/ssh/password') }}"
              command:
                - |
                  set -e
                  WORKDIR=/tmp/meridian-lab
                  mkdir -p "${WORKDIR}"
                  cp -ar /attachments/* "${WORKDIR}/"
                  echo "Building meridian/frr-lab:latest ..."
                  docker build --build-arg LAB_PASSWORD="${LAB_PASSWORD}" \
                    -t meridian/frr-lab:latest "${WORKDIR}"
                  echo "Building meridian/lab-host:latest ..."
                  docker build --build-arg LAB_PASSWORD="${LAB_PASSWORD}" \
                    -t meridian/lab-host:latest "${WORKDIR}/host"
            policy:
              timeout_sec: 660
              retries: 0
              on_failure: FAIL_RUN
              evidence_required: false
          - id: fork
            name: Deploy lab and Gitea
            type: fork
            position_x: 660
            position_y: 300
          - id: deploy_lab
            name: Deploy containerlab multi-area lab
            type: step
            kind: EXECUTE
            phase: IMPLEMENTATION
            handler: container.run
            position_x: 860
            position_y: 60
            mounted_files:
              - topology.clab.yml
              - frr/
            params:
              image: ghcr.io/srl-labs/clab:0.77.0
              working_dir: /tmp/meridian-lab
              attach_docker_socket: true
              network_mode: host
              privileged: true
              pid_mode: host
              extra_mounts:
                - "/var/run/netns:/var/run/netns:shared"
                - "/var/lib/docker:/var/lib/docker"
                - "/tmp/meridian-lab:/tmp/meridian-lab"
              timeout_seconds: 600
              command:
                - |
                  set -e
                  LAB_NAME=meridian-lab
                  WORKDIR=/tmp/meridian-lab
                  TOPOLOGY="${WORKDIR}/topology.run.clab.yml"
                  mkdir -p "${WORKDIR}"
                  cp -ar /attachments/* "${WORKDIR}/"
                  sed \
                    -e "s#__HEGEMONY_CLAB_NAME__#${LAB_NAME}#g" \
                    -e "s#__HEGEMONY_CLAB_WORKDIR__#${WORKDIR}#g" \
                    "${WORKDIR}/topology.clab.yml" > "${TOPOLOGY}"
                  # --reconfigure makes re-runs idempotent: a lab left running
                  # (teardown gate rejected) is redeployed instead of erroring.
                  containerlab deploy --reconfigure -t "${TOPOLOGY}"
            policy:
              timeout_sec: 660
              retries: 0
              on_failure: FAIL_RUN
              evidence_required: true
          - id: deploy_bastion
            name: Deploy lab bastion (SSH + SOCKS5)
            type: step
            kind: ACTION
            phase: IMPLEMENTATION
            handler: container.run
            position_x: 1280
            position_y: 60
            params:
              image: ghcr.io/srl-labs/clab:0.77.0
              working_dir: /workspace
              attach_docker_socket: true
              network_mode: host
              timeout_seconds: 180
              env:
                JUMP_USER: "{{ secret('vault://orgs/default/secrets/meridian/lab/bastion/username') }}"
                JUMP_PASSWORD: "{{ secret('vault://orgs/default/secrets/meridian/lab/bastion/password') }}"
              command:
                - |
                  set -e
                  docker rm -f meridian-bastion 2>/dev/null || true
                  # The bastion is the workers' ONLY path into the lab
                  # (design: dind-sandbox §11): device SSH sessions ProxyJump
                  # through :2222 and TCP probes ride the authenticated SOCKS5
                  # listener on :1080. Both publishes bind in the dind netns —
                  # workers reach them as dind:2222 / dind:1080 over the
                  # compose network, and nothing is published to the host. No
                  # host route, no ip_forward, no DOCKER-USER edits anywhere.
                  # --restart brings it back after a dind restart (same
                  # lifecycle as Gitea); redeploying the lab recreates it.
                  docker run -d --name meridian-bastion \
                    --restart unless-stopped \
                    --network meridian-lab-mgmt \
                    -p 2222:22 -p 1080:1080 \
                    -e JUMP_USER="$JUMP_USER" \
                    -e JUMP_PASSWORD="$JUMP_PASSWORD" \
                    alpine:3.20 \
                    sh -c '
                      set -e
                      # --restart unless-stopped re-runs this whole script on
                      # every restart (so the bastion survives a dind bounce,
                      # same lifecycle as Gitea). The container filesystem
                      # persists across restarts, so this MUST be idempotent:
                      # a second `adduser` or a `git clone` into an existing
                      # dir fails under `set -e` and wedges the bastion in a
                      # crash loop with the listeners down. Guard every one-time
                      # setup step and only (re)start the daemons at the end.
                      #
                      # microsocks is not in the alpine:3.20 stable repos
                      # (main/community) — only in edge/testing — so build the
                      # tiny single-binary SOCKS5 server from source. build-base
                      # + git are dropped again once the binary is in place.
                      [ -x /usr/sbin/sshd ] || apk add --no-cache openssh >/dev/null
                      if [ ! -x /usr/local/bin/microsocks ]; then
                        apk add --no-cache --virtual .ms-build build-base git >/dev/null
                        rm -rf /tmp/microsocks
                        # Pinned to the v1.0.5 commit, not the default branch:
                        # this builds and runs as root in a container that also
                        # holds the bastion password, so the source must be a
                        # revision someone reviewed rather than whatever HEAD
                        # happens to be at demo time.
                        mkdir -p /tmp/microsocks
                        git -C /tmp/microsocks init -q
                        git -C /tmp/microsocks fetch -q --depth 1 \
                          https://github.com/rofl0r/microsocks \
                          98421a21c4adc4c77c0cf3a5d650cc28ad3e0107 >/dev/null 2>&1
                        git -C /tmp/microsocks checkout -q FETCH_HEAD
                        make -C /tmp/microsocks >/dev/null
                        install -m 0755 /tmp/microsocks/microsocks /usr/local/bin/microsocks
                        apk del .ms-build >/dev/null
                        rm -rf /tmp/microsocks
                      fi
                      # Create the user once; always (re)set the password so a
                      # credential rotation still takes effect on a restart.
                      id "$JUMP_USER" >/dev/null 2>&1 || adduser -D "$JUMP_USER"
                      printf "%s:%s\n" "$JUMP_USER" "$JUMP_PASSWORD" | chpasswd
                      # Generate the host key explicitly instead of trusting
                      # `ssh-keygen -A`: freshly-pulled alpine:3.20 openssh
                      # builds have shipped where -A leaves no usable host key
                      # and sshd exits "no hostkeys available -- exiting". An
                      # ed25519 key (every transport here supports it) passed
                      # with -h makes startup deterministic; reuse an existing
                      # key so the bastion identity stays stable across restarts.
                      [ -s /etc/ssh/ssh_host_ed25519_key ] || ssh-keygen -t ed25519 -f /etc/ssh/ssh_host_ed25519_key -N ""
                      # ProxyJump opens a direct-tcpip channel to the device, so
                      # the bastion needs TCP forwarding. Alpine openssh ships
                      # AllowTcpForwarding=no by default (aports
                      # disable-forwarding-by-default.patch) — NOT the upstream
                      # default-on — so re-enable it explicitly, or sshd refuses
                      # the hop with "administratively prohibited". Password auth
                      # is the jump credential the inventory provider ships.
                      echo "bastion: setup ok; starting sshd (:22) + microsocks (:1080)"
                      /usr/sbin/sshd -h /etc/ssh/ssh_host_ed25519_key -o PasswordAuthentication=yes -o PermitRootLogin=no -o AllowTcpForwarding=yes
                      # RFC 1929: the SOCKS listener always authenticates —
                      # neither published port is an open proxy.
                      exec microsocks -u "$JUMP_USER" -P "$JUMP_PASSWORD" -p 1080
                    '
                  # docker run -d only proves creation; the listeners come up
                  # after the in-container build/apk step. Probe them from
                  # INSIDE the bastion (alpine busybox `nc -z`, always present)
                  # via docker exec, so readiness never depends on whether this
                  # clab image ships nc. sshd binds :22 and microsocks :1080
                  # internally (published as :2222/:1080 in the dind netns). The
                  # gate blocks the approval step until the only worker access
                  # path is actually up.
                  for i in $(seq 1 60); do
                    if docker exec meridian-bastion sh -c \
                        'nc -z 127.0.0.1 22 && nc -z 127.0.0.1 1080' 2>/dev/null; then
                      echo "Bastion ready: SSH ProxyJump dind:2222, SOCKS5 dind:1080."
                      exit 0
                    fi
                    sleep 2
                  done
                  echo "TIMEOUT waiting for bastion listeners (2222/1080)" >&2
                  docker logs meridian-bastion 2>&1 | tail -50 || true
                  exit 1
          - id: wait_ready
            name: Wait for FRR to answer on all routers
            type: step
            kind: CHECK
            phase: VERIFY
            handler: container.run
            position_x: 1700
            position_y: 60
            params:
              image: ghcr.io/srl-labs/clab:0.77.0
              working_dir: /workspace
              attach_docker_socket: true
              network_mode: host
              timeout_seconds: 180
              command:
                - |
                  set -e
                  for r in dc1-core-01 dc1-core-02 dc1-acc-01 dc1-acc-02 \
                           dc2-core-01 dc2-core-02 dc2-acc-01 \
                           br1-edge-01 br1-acc-01 br2-edge-01 br2-acc-01; do
                    C="clab-meridian-lab-$r"
                    echo "--- waiting for ${C} (vtysh) ---"
                    for i in $(seq 1 30); do
                      if docker exec "$C" vtysh -c 'show version' >/dev/null 2>&1; then
                        echo "ready: $r (attempt $i)"
                        break
                      fi
                      sleep 2
                      if [ "$i" = "30" ]; then
                        echo "TIMEOUT waiting for $r" >&2
                        exit 1
                      fi
                    done
                  done
                  for h in dc1-srv-01 dc2-srv-01 br1-srv-01 br2-srv-01; do
                    C="clab-meridian-lab-$h"
                    echo "--- waiting for ${C} (sshd) ---"
                    for i in $(seq 1 15); do
                      if docker exec "$C" pgrep sshd >/dev/null 2>&1; then
                        echo "ready: $h (attempt $i)"
                        break
                      fi
                      sleep 2
                      if [ "$i" = "15" ]; then
                        echo "TIMEOUT waiting for $h" >&2
                        exit 1
                      fi
                    done
                  done
                  echo "All 11 routers answer vtysh and all 4 endpoint hosts run sshd."
            policy:
              timeout_sec: 240
              retries: 0
              on_failure: FAIL_RUN
              evidence_required: true
          - id: deploy_gitea
            name: Deploy Gitea backup server
            type: step
            kind: EXECUTE
            phase: IMPLEMENTATION
            handler: container.run
            position_x: 860
            position_y: 500
            mounted_files:
              - seed.sh
            params:
              image: ghcr.io/srl-labs/clab:0.77.0
              working_dir: /workspace
              attach_docker_socket: true
              network_mode: host
              timeout_seconds: 300
              env:
                GITEA_CONTAINER: meridian-gitea
                GITEA_URL: "{{ vars.GITEA_URL }}"
                GITEA_ORG: "{{ vars.GITEA_ORG }}"
                ADMIN_USER: "{{ secret('vault://orgs/default/secrets/meridian/gitea/admin/username') }}"
                ADMIN_PASSWORD: "{{ secret('vault://orgs/default/secrets/meridian/gitea/admin/password') }}"
                # Password for the "x-access-token" Gitea service account the seed
                # provisions — the exact value Hegemony sends as the git Basic-auth
                # password, so native flow/platform backups authenticate out of the box.
                WRITE_PASSWORD: "{{ secret('vault://orgs/default/secrets/meridian/gitea/token/token') }}"
              command:
                - |
                  DEPLOY=$(printf '%s' "{{ inputs.deploy_gitea }}" | tr 'A-Z' 'a-z')
                  case "$DEPLOY" in
                    true|1|yes) ;;
                    *)
                      echo "Gitea deployment skipped (deploy_gitea unchecked)."
                      exit 0
                      ;;
                  esac
                  set -e
                  docker rm -f meridian-gitea 2>/dev/null || true
                  # --restart brings Gitea back after a dind daemon restart
                  # (data is still demo-ephemeral; a redeploy recreates it).
                  # ROOT_URL stays on the browser-facing address: it controls
                  # the links and clone URLs Gitea DISPLAYS, and operators
                  # reach the UI at localhost via the platform's dind port
                  # re-publish. Flows and the platform API never read
                  # ROOT_URL — they use the configured {{ vars.GITEA_URL }}
                  # (http://dind:3000) repository URLs directly.
                  docker run -d --name meridian-gitea \
                    --restart unless-stopped \
                    -p {{ vars.GITEA_PORT }}:3000 \
                    -e GITEA__security__INSTALL_LOCK=true \
                    -e GITEA__server__ROOT_URL="http://localhost:{{ vars.GITEA_PORT }}/" \
                    gitea/gitea:1.22-rootless
                  sh /attachments/seed.sh
          - id: monitor_lab
            name: Watch core-router reachability
            type: step
            kind: CHECK
            phase: IMPLEMENTATION
            handler: monitor.connectivity
            position_x: 1400
            position_y: 480
            # The four OSPF core routers, as direct IP targets. This is the
            # node's "Additional IP Targets" field in the editor (target_selectors
            # of type ip), NOT a handler param — the monitor reads it first.
            target_selectors:
              - type: ip
                addresses:
                  - 172.20.30.11
                  - 172.20.30.12
                  - 172.20.30.41
                  - 172.20.30.42
            params:
              # Watch the four core routers come up while the lab deploys.
              # tcp_connect on :22 through the bastion's authenticated SOCKS5
              # listener (dind:1080) — the only worker path into the lab
              # management subnet. schedule_mode until_join keeps the monitor
              # running until the deploy join fires (the termination edge
              # below), so the reachability count climbs from 0 to 4 as the
              # sandbox, bastion, and routers come up, then it stops right
              # before the approval gate.
              check_type: tcp_connect
              port: 22
              timeout_sec: 4
              interval_ms: 5000
              schedule_mode: until_join
              socks_proxy: "socks5://{{ secret('vault://orgs/default/secrets/meridian/lab/bastion/username') }}:{{ secret('vault://orgs/default/secrets/meridian/lab/bastion/password') }}@dind:1080"
            policy:
              # Observability only: a monitor hiccup must never fail the lab
              # bring-up. This node reaches the join through a termination edge,
              # not an execution one, so it is not one of the join's awaited
              # branches — the join fires on the deploy branches regardless, and
              # CONTINUE keeps a failed probe from propagating as a run failure.
              on_failure: CONTINUE
              evidence_required: false
          - id: join
            name: Datacenter ready
            type: join
            join_mode: all
            failure_policy: propagate
            cancel_policy: wait
            position_x: 2160
            position_y: 300
          - id: converge_check
            name: Kick off OSPF convergence check
            type: step
            kind: EXECUTE
            phase: IMPLEMENTATION
            handler: flow.run
            position_x: 2320
            position_y: 500
            params:
              # Portable name reference: the child flow's UUID is assigned at
              # import time, so the bundle refers to it by name (resolved when
              # the step runs). Fire-and-forget — the approval gate below must
              # not wait for the convergence loop to finish.
              flow_name: "Net: Wait for OSPF convergence"
              wait_for_completion: false
              field_mappings: {}
              target_mappings: {}
            policy:
              timeout_sec: 60
              retries: 0
              on_failure: CONTINUE
              evidence_required: false
          - id: hold
            name: Interact, then approve to tear down
            type: approval
            phase: IMPLEMENTATION
            position_x: 2320
            position_y: 290
            params:
              title: "Demo datacenter is up — approve to tear it down"
              message: >-
                The lab is running: 11 routers and 4 Linux endpoint hosts in
                172.20.30.0/24 (dc1 .11-.15, br1 .21-.23, br2 .31-.33,
                dc2 .41-.44; user clab). Exercise the Ops/Net flows against
                them, and browse Gitea at
                http://localhost:{{ vars.GITEA_PORT }} if deployed (the
                platform's dind service re-publishes the sandbox port to your
                machine). This gate never expires. APPROVE to tear the lab
                down and clean the sandbox; REJECT to leave it running.
          - id: teardown
            name: Destroy lab and Gitea
            type: step
            kind: EXECUTE
            phase: CLEANUP
            handler: container.run
            position_x: 2780
            position_y: 120
            mounted_files:
              - topology.clab.yml
              - frr/
            params:
              image: ghcr.io/srl-labs/clab:0.77.0
              working_dir: /tmp/meridian-lab
              attach_docker_socket: true
              network_mode: host
              privileged: true
              pid_mode: host
              extra_mounts:
                - "/var/run/netns:/var/run/netns:shared"
                - "/var/lib/docker:/var/lib/docker"
                - "/tmp/meridian-lab:/tmp/meridian-lab"
              timeout_seconds: 300
              command:
                - |
                  set -e
                  LAB_NAME=meridian-lab
                  WORKDIR=/tmp/meridian-lab
                  TOPOLOGY="${WORKDIR}/topology.run.clab.yml"
                  mkdir -p "${WORKDIR}"
                  if [ ! -f "${TOPOLOGY}" ]; then
                    cp -ar /attachments/* "${WORKDIR}/" 2>/dev/null || true
                    sed \
                      -e "s#__HEGEMONY_CLAB_NAME__#${LAB_NAME}#g" \
                      -e "s#__HEGEMONY_CLAB_WORKDIR__#${WORKDIR}#g" \
                      "${WORKDIR}/topology.clab.yml" > "${TOPOLOGY}"
                  fi
                  containerlab destroy -t "${TOPOLOGY}" --cleanup || true
                  # The bastion is the only non-clab endpoint on the mgmt
                  # network: remove it first so the network rm cannot fail on
                  # an attached container. Workers never attach to sandbox
                  # networks — they reach the lab through the bastion — so
                  # nothing else needs detaching.
                  docker rm -f meridian-bastion 2>/dev/null || true
                  docker network rm meridian-lab-mgmt 2>/dev/null || true
                  rm -rf "${WORKDIR}" || true
                  REMOVE_GITEA=$(printf '%s' "{{ inputs.remove_gitea }}" | tr 'A-Z' 'a-z')
                  case "$REMOVE_GITEA" in
                    true|1|yes)
                      docker rm -f meridian-gitea 2>/dev/null || true
                      echo "Removed Gitea container."
                      ;;
                  esac
                  echo "Teardown complete."
            policy:
              timeout_sec: 330
              retries: 0
              on_failure: FAIL_RUN
              evidence_required: true
          - id: done
            name: Lab torn down
            type: terminal
            terminal_status: success
            position_x: 3200
            position_y: 60
          - id: left_running
            name: Lab left running
            type: terminal
            terminal_status: success
            position_x: 3200
            position_y: 320
          - id: failed
            name: Lifecycle failed
            type: terminal
            terminal_status: failure
            position_x: 2780
            position_y: 560
        edges:
          - id: e_start_build
            source: start:start
            target: build_image
          - id: e_build_fork
            source: build_image:success
            target: fork
          - id: e_build_failed
            source: build_image:failure
            target: failed
          - id: e_fork_lab
            source: fork:fork
            target: deploy_lab
          - id: e_fork_gitea
            source: fork:fork
            target: deploy_gitea
          - id: e_lab_bastion
            source: deploy_lab:success
            target: deploy_bastion
          - id: e_lab_join_fail
            source: deploy_lab:failure
            target: join
          - id: e_bastion_wait
            source: deploy_bastion:success
            target: wait_ready
          - id: e_bastion_join_fail
            source: deploy_bastion:failure
            target: join
          - id: e_wait_join
            source: wait_ready:success
            target: join
          - id: e_wait_join_fail
            source: wait_ready:failure
            target: join
          - id: e_gitea_join
            source: deploy_gitea:success
            target: join
          - id: e_gitea_join_fail
            source: deploy_gitea:failure
            target: join
          # Start the reachability monitor in parallel with the deploy branches.
          - id: e_fork_monitor
            source: fork:fork
            target: monitor_lab
          # Termination edge (not execution): when the deploy join fires, stop
          # the monitor. It is deliberately NOT an execution input to the join,
          # so the join's awaited-branch count stays the two deploy branches.
          - id: e_monitor_join_term
            source: monitor_lab
            target: join
            type: termination
          - id: e_join_converge
            source: join:joined
            target: converge_check
          - id: e_converge_hold
            source: converge_check:success
            target: hold
          - id: e_converge_hold_fail
            # A failed subflow launch must not strand the run before the
            # teardown gate — both outcomes proceed to the approval.
            source: converge_check:failure
            target: hold
          - id: e_join_failed
            source: join:join_failed
            target: failed
          - id: e_hold_teardown
            source: hold:approved
            target: teardown
          - id: e_hold_left
            source: hold:rejected
            target: left_running
          - id: e_teardown_done
            source: teardown:success
            target: done
          - id: e_teardown_failed
            source: teardown:failure
            target: failed
      interface_graph:
        nodes:
          - id: sec_options
            kind: section
            position_x: 80
            position_y: 80
            width: 520
            height: 260
            data:
              label: Datacenter options
              description: What to stand up now, and what to remove at teardown.
              runtime_layout: card
              collapsible: false
          - id: f_deploy_gitea
            kind: field
            parent_id: sec_options
            position_x: 40
            position_y: 60
            data:
              label: Deploy Gitea backup server
              field_id: deploy_gitea
              field_type: core.bool
              required: false
              default_value: true
              description: Also stand up a local Gitea for the config-backup workflow.
              config: {}
          - id: f_remove_gitea
            kind: field
            parent_id: sec_options
            position_x: 40
            position_y: 150
            data:
              label: Remove Gitea at teardown
              field_id: remove_gitea
              field_type: core.bool
              required: false
              default_value: true
              description: Remove the Gitea container when the lab is torn down.
              config: {}
        edges:
          - id: e_gitea_enables_remove
            source: f_deploy_gitea
            target: f_remove_gitea
            relations:
