# A single long-running lifecycle flow for the self-contained demo datacenter.
# It builds the lab images (FRR+sshd routers, Alpine+sshd endpoint hosts),
# deploys an 11-router / 4-host multi-area OSPF lab (two datacenters + two
# branches, see src/files/lab/topology.clab.yml) with fixed management
# addresses, attaches the lab management network to the Hegemony workers (so
# the seeded inventory becomes reachable), and optionally stands up a local
# Gitea for config backups. It then PARKS on an approval gate
# WITH NO EXPIRY: the run stays paused — the lab keeps running on the host —
# while you SSH to the routers and exercise the other flows against them.
# Approving the gate tears the lab down; rejecting leaves it running. This is
# the only flow that touches the host Docker daemon, and a good example of a
# run that stays open for hours or days.

schema_version: 2

flows:
  - name: "Lab: Provision and tear down demo datacenter"
    description: >-
      Build the lab images, deploy the multi-area OSPF lab (11 routers and 4
      Linux endpoint hosts across dc1, dc2 and two branches), attach the lab
      network to the workers, and optionally stand up Gitea; then hold at an
      approval gate (no expiry) so you can interact with the lab. Approve to
      tear it down, reject to leave it running.
    definition:
      # Only one lab may exist at a time: this flow drives the host Docker
      # daemon and deploys a topology on fixed management addresses, so a
      # second concurrent run would fight the first over images, container
      # names and IP addresses. Note that the run parks on an approval gate
      # with no expiry, and a parked run still holds its slot — which is
      # exactly right here: the lab stays occupied until you approve the
      # teardown. The cooldown keeps an accidental double-click from racing a
      # rebuild against a teardown.
      run_limits:
        max_concurrent_runs: 1
        cooldown_seconds: 60
      graph:
        nodes:
          - id: start
            name: Start
            type: start
            position_x: 0
            position_y: 280
          - id: build_image
            name: Build lab images
            type: step
            kind: EXECUTE
            phase: PREPARE
            handler: container.run
            position_x: 240
            position_y: 280
            mounted_files:
              - Dockerfile
              - entrypoint.sh
              - host/
            params:
              image: ghcr.io/srl-labs/clab:0.77.0
              working_dir: /tmp/meridian-lab
              attach_docker_socket: true
              network_mode: host
              timeout_seconds: 600
              env:
                # Single source of truth for the router login: the same vault
                # secret the inventory provider hands to netcli.
                LAB_PASSWORD: "{{ secret('vault://orgs/default/secrets/meridian/lab/ssh/password') }}"
              command:
                - |
                  set -e
                  WORKDIR=/tmp/meridian-lab
                  mkdir -p "${WORKDIR}"
                  cp -ar /attachments/* "${WORKDIR}/"
                  echo "Building meridian/frr-lab:latest ..."
                  docker build --build-arg LAB_PASSWORD="${LAB_PASSWORD}" \
                    -t meridian/frr-lab:latest "${WORKDIR}"
                  echo "Building meridian/lab-host:latest ..."
                  docker build --build-arg LAB_PASSWORD="${LAB_PASSWORD}" \
                    -t meridian/lab-host:latest "${WORKDIR}/host"
            policy:
              timeout_sec: 660
              retries: 0
              on_failure: FAIL_RUN
              evidence_required: false
          - id: fork
            name: Deploy lab and Gitea
            type: fork
            position_x: 660
            position_y: 300
          - id: deploy_lab
            name: Deploy containerlab multi-area lab
            type: step
            kind: EXECUTE
            phase: IMPLEMENTATION
            handler: container.run
            position_x: 860
            position_y: 60
            mounted_files:
              - topology.clab.yml
              - frr/
            params:
              image: ghcr.io/srl-labs/clab:0.77.0
              working_dir: /tmp/meridian-lab
              attach_docker_socket: true
              network_mode: host
              privileged: true
              pid_mode: host
              extra_mounts:
                - "/var/run/netns:/var/run/netns:shared"
                - "/var/lib/docker:/var/lib/docker"
                - "/tmp/meridian-lab:/tmp/meridian-lab"
              timeout_seconds: 600
              command:
                - |
                  set -e
                  LAB_NAME=meridian-lab
                  WORKDIR=/tmp/meridian-lab
                  TOPOLOGY="${WORKDIR}/topology.run.clab.yml"
                  mkdir -p "${WORKDIR}"
                  cp -ar /attachments/* "${WORKDIR}/"
                  sed \
                    -e "s#__HEGEMONY_CLAB_NAME__#${LAB_NAME}#g" \
                    -e "s#__HEGEMONY_CLAB_WORKDIR__#${WORKDIR}#g" \
                    "${WORKDIR}/topology.clab.yml" > "${TOPOLOGY}"
                  # --reconfigure makes re-runs idempotent: a lab left running
                  # (teardown gate rejected) is redeployed instead of erroring.
                  containerlab deploy --reconfigure -t "${TOPOLOGY}"
            policy:
              timeout_sec: 660
              retries: 0
              on_failure: FAIL_RUN
              evidence_required: true
          - id: connect_workers
            name: Open lab route for workers
            type: step
            kind: ACTION
            phase: IMPLEMENTATION
            handler: container.run
            position_x: 1280
            position_y: 60
            params:
              image: ghcr.io/srl-labs/clab:0.77.0
              working_dir: /workspace
              network_mode: host
              privileged: true
              timeout_seconds: 120
              command:
                - |
                  set -e
                  # The lab bridge lives inside the platform's dind sandbox
                  # daemon, and the Hegemony workers reach it through a routed
                  # hop: a host route (installed by the stack's
                  # lab-route-installer sidecar) points {{ vars.LAB_MGMT_SUBNET }}
                  # at dind, and this step opens the dind side — forwarding plus
                  # DOCKER-USER accepts in the dind netns, which is exactly what
                  # network_mode: host means here. Idempotent and re-run by
                  # every lab deploy; dind-netns rules evaporate on a dind
                  # restart, so redeploying the lab restores them.
                  sysctl -w net.ipv4.ip_forward=1
                  iptables -C DOCKER-USER -d {{ vars.LAB_MGMT_SUBNET }} -j ACCEPT 2>/dev/null \
                    || iptables -I DOCKER-USER -d {{ vars.LAB_MGMT_SUBNET }} -j ACCEPT
                  iptables -C DOCKER-USER -s {{ vars.LAB_MGMT_SUBNET }} -j ACCEPT 2>/dev/null \
                    || iptables -I DOCKER-USER -s {{ vars.LAB_MGMT_SUBNET }} -j ACCEPT
                  echo "Opened worker route into {{ vars.LAB_MGMT_SUBNET }} (dind-side forwarding + DOCKER-USER accepts)"
          - id: wait_ready
            name: Wait for FRR to answer on all routers
            type: step
            kind: CHECK
            phase: VERIFY
            handler: container.run
            position_x: 1700
            position_y: 60
            params:
              image: ghcr.io/srl-labs/clab:0.77.0
              working_dir: /workspace
              attach_docker_socket: true
              network_mode: host
              timeout_seconds: 180
              command:
                - |
                  set -e
                  for r in dc1-core-01 dc1-core-02 dc1-acc-01 dc1-acc-02 \
                           dc2-core-01 dc2-core-02 dc2-acc-01 \
                           br1-edge-01 br1-acc-01 br2-edge-01 br2-acc-01; do
                    C="clab-meridian-lab-$r"
                    echo "--- waiting for ${C} (vtysh) ---"
                    for i in $(seq 1 30); do
                      if docker exec "$C" vtysh -c 'show version' >/dev/null 2>&1; then
                        echo "ready: $r (attempt $i)"
                        break
                      fi
                      sleep 2
                      if [ "$i" = "30" ]; then
                        echo "TIMEOUT waiting for $r" >&2
                        exit 1
                      fi
                    done
                  done
                  for h in dc1-srv-01 dc2-srv-01 br1-srv-01 br2-srv-01; do
                    C="clab-meridian-lab-$h"
                    echo "--- waiting for ${C} (sshd) ---"
                    for i in $(seq 1 15); do
                      if docker exec "$C" pgrep sshd >/dev/null 2>&1; then
                        echo "ready: $h (attempt $i)"
                        break
                      fi
                      sleep 2
                      if [ "$i" = "15" ]; then
                        echo "TIMEOUT waiting for $h" >&2
                        exit 1
                      fi
                    done
                  done
                  echo "All 11 routers answer vtysh and all 4 endpoint hosts run sshd."
            policy:
              timeout_sec: 240
              retries: 0
              on_failure: FAIL_RUN
              evidence_required: true
          - id: deploy_gitea
            name: Deploy Gitea backup server
            type: step
            kind: EXECUTE
            phase: IMPLEMENTATION
            handler: container.run
            position_x: 860
            position_y: 500
            mounted_files:
              - seed.sh
            params:
              image: ghcr.io/srl-labs/clab:0.77.0
              working_dir: /workspace
              attach_docker_socket: true
              network_mode: host
              timeout_seconds: 300
              env:
                GITEA_CONTAINER: meridian-gitea
                GITEA_URL: "{{ vars.GITEA_URL }}"
                GITEA_ORG: "{{ vars.GITEA_ORG }}"
                ADMIN_USER: "{{ secret('vault://orgs/default/secrets/meridian/gitea/admin/username') }}"
                ADMIN_PASSWORD: "{{ secret('vault://orgs/default/secrets/meridian/gitea/admin/password') }}"
                # Password for the "x-access-token" Gitea service account the seed
                # provisions — the exact value Hegemony sends as the git Basic-auth
                # password, so native flow/platform backups authenticate out of the box.
                WRITE_PASSWORD: "{{ secret('vault://orgs/default/secrets/meridian/gitea/token/token') }}"
              command:
                - |
                  DEPLOY=$(printf '%s' "{{ inputs.deploy_gitea }}" | tr 'A-Z' 'a-z')
                  case "$DEPLOY" in
                    true|1|yes) ;;
                    *)
                      echo "Gitea deployment skipped (deploy_gitea unchecked)."
                      exit 0
                      ;;
                  esac
                  set -e
                  docker rm -f meridian-gitea 2>/dev/null || true
                  # --restart brings Gitea back after a dind daemon restart
                  # (data is still demo-ephemeral; a redeploy recreates it).
                  docker run -d --name meridian-gitea \
                    --restart unless-stopped \
                    -p 3000:3000 \
                    -e GITEA__security__INSTALL_LOCK=true \
                    -e GITEA__server__ROOT_URL="{{ vars.GITEA_URL }}/" \
                    gitea/gitea:1.22-rootless
                  sh /attachments/seed.sh
          - id: join
            name: Datacenter ready
            type: join
            join_mode: all
            failure_policy: propagate
            cancel_policy: wait
            position_x: 2160
            position_y: 300
          - id: converge_check
            name: Kick off OSPF convergence check
            type: step
            kind: EXECUTE
            phase: IMPLEMENTATION
            handler: flow.run
            position_x: 2320
            position_y: 500
            params:
              # Portable name reference: the child flow's UUID is assigned at
              # import time, so the bundle refers to it by name (resolved when
              # the step runs). Fire-and-forget — the approval gate below must
              # not wait for the convergence loop to finish.
              flow_name: "Net: Wait for OSPF convergence"
              wait_for_completion: false
              field_mappings: {}
              target_mappings: {}
            policy:
              timeout_sec: 60
              retries: 0
              on_failure: CONTINUE
              evidence_required: false
          - id: hold
            name: Interact, then approve to tear down
            type: approval
            phase: IMPLEMENTATION
            position_x: 2320
            position_y: 290
            params:
              title: "Demo datacenter is up — approve to tear it down"
              message: >-
                The lab is running: 11 routers and 4 Linux endpoint hosts in
                172.20.30.0/24 (dc1 .11-.15, br1 .21-.23, br2 .31-.33,
                dc2 .41-.44; user clab). Exercise the Ops/Net flows against
                them — including the end-to-end reachability test from the
                endpoint hosts — and browse Gitea at http://localhost:3000 if
                deployed (the platform's dind service re-publishes the sandbox
                port to your machine). This gate never expires. APPROVE to tear
                the lab down and clean the sandbox; REJECT to leave it running.
          - id: teardown
            name: Destroy lab and Gitea
            type: step
            kind: EXECUTE
            phase: CLEANUP
            handler: container.run
            position_x: 2780
            position_y: 120
            mounted_files:
              - topology.clab.yml
              - frr/
            params:
              image: ghcr.io/srl-labs/clab:0.77.0
              working_dir: /tmp/meridian-lab
              attach_docker_socket: true
              network_mode: host
              privileged: true
              pid_mode: host
              extra_mounts:
                - "/var/run/netns:/var/run/netns:shared"
                - "/var/lib/docker:/var/lib/docker"
                - "/tmp/meridian-lab:/tmp/meridian-lab"
              timeout_seconds: 300
              command:
                - |
                  set -e
                  LAB_NAME=meridian-lab
                  WORKDIR=/tmp/meridian-lab
                  TOPOLOGY="${WORKDIR}/topology.run.clab.yml"
                  mkdir -p "${WORKDIR}"
                  if [ ! -f "${TOPOLOGY}" ]; then
                    cp -ar /attachments/* "${WORKDIR}/" 2>/dev/null || true
                    sed \
                      -e "s#__HEGEMONY_CLAB_NAME__#${LAB_NAME}#g" \
                      -e "s#__HEGEMONY_CLAB_WORKDIR__#${WORKDIR}#g" \
                      "${WORKDIR}/topology.clab.yml" > "${TOPOLOGY}"
                  fi
                  containerlab destroy -t "${TOPOLOGY}" --cleanup || true
                  # Workers are not containers of the sandbox daemon (they reach
                  # the lab over a routed hop, not docker network connect), so
                  # there is nothing to detach before removing the network.
                  docker network rm meridian-lab-mgmt 2>/dev/null || true
                  rm -rf "${WORKDIR}" || true
                  REMOVE_GITEA=$(printf '%s' "{{ inputs.remove_gitea }}" | tr 'A-Z' 'a-z')
                  case "$REMOVE_GITEA" in
                    true|1|yes)
                      docker rm -f meridian-gitea 2>/dev/null || true
                      echo "Removed Gitea container."
                      ;;
                  esac
                  echo "Teardown complete."
            policy:
              timeout_sec: 330
              retries: 0
              on_failure: FAIL_RUN
              evidence_required: true
          - id: done
            name: Lab torn down
            type: terminal
            terminal_status: success
            position_x: 3200
            position_y: 60
          - id: left_running
            name: Lab left running
            type: terminal
            terminal_status: success
            position_x: 3200
            position_y: 320
          - id: failed
            name: Lifecycle failed
            type: terminal
            terminal_status: failure
            position_x: 2780
            position_y: 560
        edges:
          - id: e_start_build
            source: start:start
            target: build_image
          - id: e_build_fork
            source: build_image:success
            target: fork
          - id: e_build_failed
            source: build_image:failure
            target: failed
          - id: e_fork_lab
            source: fork:fork
            target: deploy_lab
          - id: e_fork_gitea
            source: fork:fork
            target: deploy_gitea
          - id: e_lab_connect
            source: deploy_lab:success
            target: connect_workers
          - id: e_lab_join_fail
            source: deploy_lab:failure
            target: join
          - id: e_connect_wait
            source: connect_workers:success
            target: wait_ready
          - id: e_connect_join_fail
            source: connect_workers:failure
            target: join
          - id: e_wait_join
            source: wait_ready:success
            target: join
          - id: e_wait_join_fail
            source: wait_ready:failure
            target: join
          - id: e_gitea_join
            source: deploy_gitea:success
            target: join
          - id: e_gitea_join_fail
            source: deploy_gitea:failure
            target: join
          - id: e_join_converge
            source: join:joined
            target: converge_check
          - id: e_converge_hold
            source: converge_check:success
            target: hold
          - id: e_converge_hold_fail
            # A failed subflow launch must not strand the run before the
            # teardown gate — both outcomes proceed to the approval.
            source: converge_check:failure
            target: hold
          - id: e_join_failed
            source: join:join_failed
            target: failed
          - id: e_hold_teardown
            source: hold:approved
            target: teardown
          - id: e_hold_left
            source: hold:rejected
            target: left_running
          - id: e_teardown_done
            source: teardown:success
            target: done
          - id: e_teardown_failed
            source: teardown:failure
            target: failed
      interface_graph:
        nodes:
          - id: sec_options
            kind: section
            position_x: 80
            position_y: 80
            width: 520
            height: 260
            data:
              label: Datacenter options
              description: What to stand up now, and what to remove at teardown.
              runtime_layout: card
              collapsible: false
          - id: f_deploy_gitea
            kind: field
            parent_id: sec_options
            position_x: 40
            position_y: 60
            data:
              label: Deploy Gitea backup server
              field_id: deploy_gitea
              field_type: core.bool
              required: false
              default_value: true
              description: Also stand up a local Gitea for the config-backup workflow.
              config: {}
          - id: f_remove_gitea
            kind: field
            parent_id: sec_options
            position_x: 40
            position_y: 150
            data:
              label: Remove Gitea at teardown
              field_id: remove_gitea
              field_type: core.bool
              required: false
              default_value: true
              description: Remove the Gitea container when the lab is torn down.
              config: {}
        edges:
          - id: e_gitea_enables_remove
            source: f_deploy_gitea
            target: f_remove_gitea
            relations:
              - semantic_type: enabled_when
                operator: truthy
                value: null

