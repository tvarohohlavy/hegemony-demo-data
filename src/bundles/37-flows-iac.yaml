# Infrastructure-as-code demo flows: realistic Ansible and Terraform pipelines
# that exercise the control-flow constructs against the running lab.
#
#  * "IaC: Ansible server baseline rollout" is a rolling, canary-style deploy:
#    a FOR-EACH loop baselines the lab's Linux servers one at a time with a
#    real Ansible playbook (SSH + become, golden standards from {{ vars.* }}).
#    The first failing host trips a BREAK edge that exits the loop and halts
#    the rollout; run.vars.current_host names the culprit. The loop collects
#    each finished host and a report step reads
#    {{ steps.rollout.output.results }} downstream.
#  * "IaC: Terraform router service" is the classic plan → gate → apply
#    pipeline: Terraform (builtin terraform_data resources, offline, state in
#    the run's /shared workspace) records the desired service loopback per
#    router; a VALUE-mode branch switches on the launch form's action
#    (plan-only vs apply), apply is approval-gated, a -detailed-exitcode
#    verify proves convergence, and netcli pushes the declared config to the
#    FRR routers with post-change evidence asserted.
#
# NOTE: the Ansible server flow needs the lab-host image with python3 + sudo
# (src/files/lab/host/Dockerfile) — re-run "Lab: Provision and tear down demo
# datacenter" after updating the demo data so the image is rebuilt.

schema_version: 2

flows:
  - name: "IaC: Ansible server baseline rollout"
    description: >-
      Roll the golden server baseline across the lab's Linux hosts one host at
      a time with Ansible (SSH + become, standards resolved from org
      variables). A failing host halts the rollout immediately via the loop's
      break edge — run variables record the host being processed and how many
      completed — and a report step summarizes the hosts the loop collected.
    definition:
      graph:
        nodes:
          - id: start
            name: Start
            type: start
            position_x: 0
            position_y: 240
          - id: sv_init
            name: Init rollout state
            type: set_vars
            position_x: 200
            position_y: 240
            assignments:
              - name: rolled_out
                expr: "0"
              - name: current_host
                expr: "''"
          - id: rollout
            name: For each server
            type: loop
            loop_mode: for_each
            items_expr: "targets.baseline_targets | map(attribute='name') | list"
            max_iterations: 16
            collect: "loop.item"
            position_x: 600
            position_y: 80
            width: 1280
            height: 340
          - id: sv_mark
            name: Mark current host
            type: set_vars
            scope_id: rollout
            position_x: 60
            position_y: 100
            assignments:
              - name: current_host
                expr: "loop.item"
          - id: apply_baseline
            name: Apply server baseline
            type: step
            kind: EXECUTE
            phase: IMPLEMENTATION
            handler: container.run
            scope_id: rollout
            position_x: 460
            position_y: 100
            mounted_files:
              - hosts.ini
              - baseline.yml
              - rolling.sh
            params:
              image: alpine:3.22
              working_dir: /workspace
              timeout_seconds: 300
              command:
                - sh /attachments/rolling.sh
              # Container-level egress policy (narrows the flow's open default,
              # so no admin role is needed). This step installs ansible from the
              # Alpine package mirror and SSHes into the lab servers to apply the
              # baseline — nothing else. Allow-list exactly that: HTTP/HTTPS for
              # `apk add`, and SSH to the lab management subnet. Everything else
              # (including the cloud metadata endpoint, denied explicitly so the
              # deny-beats-allow precedence is visible) is dropped on the sandbox
              # daemon. Enforced on a policy bridge, so host networking is gone —
              # the allow ACCEPT punches through to the lab subnet.
              egress_mode: allow-listed
              # Literal CIDRs, not {{ vars.LAB_MGMT_SUBNET }}: egress rules are
              # grammar-checked at save time, before templates resolve.
              egress_allow:
                - 0.0.0.0/0:80/tcp
                - 0.0.0.0/0:443/tcp
                - 172.20.30.0/24:22/tcp
              egress_deny:
                - 169.254.169.254/32
              env:
                TARGET_HOST: "{{ loop.item }}"
                LAB_USER: "{{ secret('vault://orgs/default/secrets/meridian/lab/ssh/username') }}"
                LAB_PASSWORD: "{{ secret('vault://orgs/default/secrets/meridian/lab/ssh/password') }}"
                TENANT_NAME: "{{ vars.TENANT_NAME }}"
                NTP_PRIMARY: "{{ vars.NTP_PRIMARY }}"
                DNS_PRIMARY: "{{ vars.DNS_PRIMARY }}"
                SYSLOG_PRIMARY: "{{ vars.SYSLOG_PRIMARY }}"
            policy:
              timeout_sec: 330
              retries: 0
              on_failure: CONTINUE
              evidence_required: false
          - id: sv_ok
            name: Count host done
            type: set_vars
            scope_id: rollout
            position_x: 840
            position_y: 100
            assignments:
              - name: rolled_out
                expr: "(run.vars.rolled_out | default(0) | int) + 1"
          - id: rollout_end
            name: Loop End
            type: loop_end
            loop_ref: rollout
            scope_id: rollout
            position_x: 1202
            position_y: 306
          - id: report
            name: Rollout report
            type: step
            kind: EXECUTE
            phase: VERIFY
            handler: container.run
            position_x: 2000
            position_y: 200
            params:
              image: alpine:3.22
              working_dir: /workspace
              timeout_seconds: 60
              # This step only formats a text report into an artifact — it never
              # touches the network. deny-all gets it --network none on the
              # sandbox daemon: the tightest possible policy, and a container
              # that cannot exfiltrate the rollout results it just read.
              egress_mode: deny-all
              command:
                - |
                  mkdir -p /artifacts/new
                  {
                    echo "Ansible server baseline rollout"
                    echo "Hosts baselined (${COUNT}): ${BASELINED}"
                  } | tee /artifacts/new/rollout-report.txt
              env:
                BASELINED: "{{ steps.rollout.output.results | join(', ') }}"
                COUNT: "{{ run.vars.rolled_out | default(0) }}"
            policy:
              timeout_sec: 90
              retries: 0
              on_failure: CONTINUE
              evidence_required: false
          - id: ok
            name: Rollout complete
            type: terminal
            terminal_status: success
            position_x: 2420
            position_y: 210
          - id: halted
            name: Rollout halted
            type: terminal
            terminal_status: failure
            position_x: 2000
            position_y: 480
        edges:
          - source: start:start
            target: sv_init
          - source: sv_init:success
            target: rollout
          - source: rollout:iterate
            target: sv_mark
          - source: sv_mark:success
            target: apply_baseline
          - source: apply_baseline:success
            target: sv_ok
          - source: sv_ok:success
            target: rollout_end
          # The canary break: a failing host exits the loop and halts the run.
          - source: apply_baseline:failure
            target: halted
          - source: rollout:done
            target: report
          - source: rollout:max_iterations
            target: halted
          - source: report:success
            target: ok
          - source: report:failure
            target: halted
      interface_graph:
        nodes:
          - id: sec_targets
            kind: section
            position_x: 80
            position_y: 80
            width: 520
            height: 200
            data:
              label: Servers
              runtime_layout: card
              collapsible: false
          - id: f_hosts
            kind: field
            parent_id: sec_targets
            position_x: 40
            position_y: 60
            data:
              label: Servers to baseline
              field_id: baseline_hosts
              field_type: inventory.device
              required: true
              description: >-
                Lab Linux servers, baselined strictly in this order — the
                rollout stops at the first failure.
              default_value:
                - dc1-srv-01
                - dc2-srv-01
                - br1-srv-01
                - br2-srv-01
              config:
                role: baseline_targets
                multiple: true
                option_source:
                  kind: inventory.devices
        edges: []

  - name: "IaC: Terraform router service"
    description: >-
      Declare a routed service loopback in Terraform (offline, builtin
      resources, state in the run's shared workspace), then switch on the
      requested action: plan-only stops after the reviewable plan artifact,
      apply is approval-gated and followed by a -detailed-exitcode
      convergence check before netcli pushes the declared config to the
      routers and asserts the post-change evidence.
    definition:
      # Flow-level egress policy, governing BOTH kinds of steps: worker-side
      # netcli (config push + evidence) may reach only the bastion hop
      # (dind:2222) and the lab routers' SSH — every other worker dial is
      # refused before connecting. The container.run steps are Terraform
      # running fully offline (builtin resources, no provider downloads,
      # state in the shared workspace), so each narrows this policy to
      # deny-all — no network at all. Narrowing is always allowed; widening
      # a step beyond the flow policy would need the admin role.
      network_policy:
        egress:
          mode: allow-listed
          allow:
            - dind:2222
            # Literal CIDR, not {{ vars.LAB_MGMT_SUBNET }}: egress rules are
            # parsed at admission, before template resolution.
            - 172.20.30.0/24:22/tcp
      # Terraform serializes on its state: a second apply against the same
      # state either blocks on the lock or, worse, plans against a state the
      # first run is mid-way through rewriting. Admitting one run at a time
      # turns that into an immediate, readable refusal instead of a wedged
      # run. The apply path is approval-gated, and a run parked on that gate
      # keeps holding the slot — correct, since its state is still checked out.
      run_limits:
        max_concurrent_runs: 1
      graph:
        nodes:
          - id: start
            name: Start
            type: start
            position_x: 0
            position_y: 280
          - id: plan
            name: terraform plan
            type: step
            kind: CHECK
            phase: PREPARE
            handler: container.run
            execution_affinity: shared
            position_x: 200
            position_y: 280
            mounted_files:
              - service.tf
              - plan.sh
            params:
              image: hashicorp/terraform:1.9
              entrypoint: /bin/sh
              working_dir: /workspace
              timeout_seconds: 240
              command:
                - sh /attachments/plan.sh
              env:
                TF_VAR_service_name: "{{ inputs.service_name }}"
                TF_VAR_service_prefix: "{{ inputs.service_prefix }}"
                TF_VAR_routers: "{{ targets.tf_targets | map(attribute='name') | list | tojson }}"
              # Terraform is fully offline here: narrow the flow's allow list
              # (bastion + router SSH, for the netcli steps) to no network.
              egress_mode: deny-all
            policy:
              timeout_sec: 300
              retries: 0
              on_failure: CONTINUE
              evidence_required: false
          - id: route
            name: Requested action?
            type: branch
            branch_mode: value
            value_expr: "inputs.tf_action"
            position_x: 620
            position_y: 270
            cases:
              - id: c_plan
                label: Plan only
                equals: plan
              - id: c_apply
                label: Plan and apply
                equals: apply
          - id: plan_done
            name: Plan reviewed
            type: terminal
            terminal_status: success
            position_x: 970
            position_y: 80
          - id: gate
            name: Approve apply
            type: approval
            phase: IMPLEMENTATION
            position_x: 970
            position_y: 270
            params:
              title: Approve Terraform apply
              message: >-
                Review the terraform-plan.txt artifact on the plan step, then
                approve to apply the saved plan and push the declared service
                loopback to the selected routers.
              timeout_seconds: 3600
            policy:
              timeout_sec: 3600
              retries: 0
              on_failure: FAIL_RUN
              evidence_required: false
          - id: apply
            name: terraform apply
            type: step
            kind: ACTION
            phase: IMPLEMENTATION
            handler: container.run
            execution_affinity: shared
            position_x: 1440
            position_y: 270
            mounted_files:
              - apply.sh
            params:
              image: hashicorp/terraform:1.9
              entrypoint: /bin/sh
              working_dir: /workspace
              timeout_seconds: 240
              command:
                - sh /attachments/apply.sh
              egress_mode: deny-all
            policy:
              timeout_sec: 300
              retries: 0
              on_failure: CONTINUE
              evidence_required: false
          - id: tf_verify
            name: Convergence check
            type: step
            kind: CHECK
            phase: VERIFY
            handler: container.run
            execution_affinity: shared
            position_x: 1860
            position_y: 270
            mounted_files:
              - verify.sh
            params:
              image: hashicorp/terraform:1.9
              entrypoint: /bin/sh
              working_dir: /workspace
              timeout_seconds: 240
              command:
                - sh /attachments/verify.sh
              env:
                TF_VAR_service_name: "{{ inputs.service_name }}"
                TF_VAR_service_prefix: "{{ inputs.service_prefix }}"
                TF_VAR_routers: "{{ targets.tf_targets | map(attribute='name') | list | tojson }}"
              egress_mode: deny-all
            policy:
              timeout_sec: 300
              retries: 0
              on_failure: CONTINUE
              evidence_required: false
          - id: push
            name: Push config to routers
            type: step
            kind: ACTION
            phase: IMPLEMENTATION
            handler: netcli.execute
            position_x: 2280
            position_y: 270
            target_selectors:
              - type: role
                role: tf_targets
            params:
              commands:
                - configure terminal
                - interface lo
                - "description svc {{ inputs.service_name }} managed-by-terraform"
                - "ip address {{ inputs.service_prefix }}/32"
                - end
            policy:
              timeout_sec: 120
              retries: 0
              on_failure: CONTINUE
              evidence_required: false
          - id: postcheck
            name: Post-change evidence
            type: step
            kind: CHECK
            phase: VERIFY
            handler: netcli.collect_evidence
            position_x: 2700
            position_y: 270
            target_selectors:
              - type: role
                role: tf_targets
            params:
              commands:
                - show running-config
            policy:
              timeout_sec: 120
              retries: 0
              on_failure: CONTINUE
              evidence_required: true
          - id: confirm
            name: Declared config present?
            type: step
            kind: CHECK
            phase: VERIFY
            handler: evidence.assert
            position_x: 3120
            position_y: 270
            params:
              artifact_step_id: postcheck
              target_role: tf_targets
              command: show running-config
              # Line scope: the service description line must exist on every
              # router AND still carry the managed-by-terraform tag — catching
              # a hand-edited description, not just a missing one.
              operator: contains
              expected: managed-by-terraform
              match_scope: lines
              line_filter: "description svc {{ inputs.service_name }} "
              min_lines: 1
              message: A target router does not carry the declared service loopback.
            policy:
              timeout_sec: 60
              retries: 0
              on_failure: CONTINUE
              evidence_required: false
          - id: done
            name: Service deployed
            type: terminal
            terminal_status: success
            position_x: 3540
            position_y: 180
          - id: failed
            name: Deployment failed
            type: terminal
            terminal_status: failure
            position_x: 1700
            position_y: 600
        edges:
          - source: start:start
            target: plan
          - source: plan:success
            target: route
          - source: plan:failure
            target: failed
          - source: "route:case:c_plan"
            target: plan_done
          - source: "route:case:c_apply"
            target: gate
          - source: route:else
            target: failed
          - source: route:error
            target: failed
          - source: gate:approved
            target: apply
          - source: gate:rejected
            target: failed
          - source: gate:expired
            target: failed
          - source: apply:success
            target: tf_verify
          - source: apply:failure
            target: failed
          - source: tf_verify:success
            target: push
          - source: tf_verify:failure
            target: failed
          - source: push:success
            target: postcheck
          - source: push:failure
            target: failed
          - source: postcheck:success
            target: confirm
          - source: postcheck:failure
            target: failed
          - source: confirm:success
            target: done
          - source: confirm:failure
            target: failed
      interface_graph:
        nodes:
          - id: sec_action
            kind: section
            position_x: 80
            position_y: 80
            width: 440
            height: 180
            data:
              label: Action
              runtime_layout: card
              collapsible: false
          - id: f_action
            kind: field
            parent_id: sec_action
            position_x: 40
            position_y: 60
            data:
              label: Terraform action
              field_id: tf_action
              field_type: core.enum
              required: true
              default_value: plan
              description: Plan-only stops after the reviewable plan artifact.
              config:
                option_source:
                  kind: core.static
                  static_options:
                    - value: plan
                      label: Plan only
                    - value: apply
                      label: Plan and apply (approval-gated)
          - id: sec_service
            kind: section
            position_x: 560
            position_y: 80
            width: 520
            height: 220
            data:
              label: Service
              runtime_layout: card
              collapsible: false
          - id: f_service_name
            kind: field
            parent_id: sec_service
            position_x: 40
            position_y: 60
            data:
              label: Service name
              field_id: service_name
              field_type: core.text
              required: true
              default_value: telemetry
              description: Short identifier stamped into the interface description.
              config:
                validations:
                  combinator: AND
                  children:
                    - id: v_name
                      op: regex
                      operand:
                        kind: value
                        value: "^[a-z][a-z0-9-]{1,20}$"
          - id: f_service_prefix
            kind: field
            parent_id: sec_service
            position_x: 300
            position_y: 60
            data:
              label: Service address
              field_id: service_prefix
              field_type: core.text
              required: true
              default_value: "10.210.10.1"
              description: Host address for the service loopback (pushed as a /32).
              config:
                validations:
                  combinator: AND
                  children:
                    - id: v_prefix
                      op: regex
                      operand:
                        kind: value
                        value: "^10\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$"
          - id: sec_targets
            kind: section
            position_x: 1140
            position_y: 80
            width: 480
            height: 180
            data:
              label: Target routers
              runtime_layout: card
              collapsible: false
          - id: f_targets
            kind: field
            parent_id: sec_targets
            position_x: 40
            position_y: 60
            data:
              label: Routers
              field_id: tf_targets
              field_type: inventory.device
              required: true
              description: Routers that must carry the service loopback.
              default_value:
                - dc1-core-01
                - dc2-core-01
              config:
                role: tf_targets
                multiple: true
                option_source:
                  kind: inventory.devices
        edges: []


flow_attachments:
  - flow: "IaC: Ansible server baseline rollout"
    filename: hosts.ini
    content_file: src/files/ansible/hosts.ini
  - flow: "IaC: Ansible server baseline rollout"
    filename: baseline.yml
    content_file: src/files/ansible/baseline.yml
  - flow: "IaC: Ansible server baseline rollout"
    filename: rolling.sh
    content_file: src/files/ansible/rolling.sh
  - flow: "IaC: Terraform router service"
    filename: service.tf
    content_file: src/files/terraform/service.tf
  - flow: "IaC: Terraform router service"
    filename: plan.sh
    content_file: src/files/terraform/plan.sh
  - flow: "IaC: Terraform router service"
    filename: apply.sh
    content_file: src/files/terraform/apply.sh
  - flow: "IaC: Terraform router service"
    filename: verify.sh
    content_file: src/files/terraform/verify.sh
