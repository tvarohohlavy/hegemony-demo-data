# Infrastructure-as-code demo flows: realistic Ansible and Terraform pipelines
# that exercise the control-flow constructs against the running lab.
#
#  * "IaC: Ansible server baseline rollout" is a rolling, canary-style deploy:
#    a FOR-EACH loop baselines the lab's Linux servers one at a time with a
#    real Ansible playbook (SSH + become, golden standards from {{ vars.* }}).
#    The first failing host trips a BREAK edge that exits the loop and halts
#    the rollout; run.vars.current_host names the culprit. The loop collects
#    each finished host and a report step reads
#    {{ steps.rollout.output.results }} downstream.
#  * "IaC: Terraform router service" is the classic plan → gate → apply
#    pipeline: Terraform (builtin terraform_data resources, offline, state in
#    the run's /shared workspace) records the desired service loopback per
#    router; a VALUE-mode branch switches on the launch form's action
#    (plan-only vs apply), apply is approval-gated, a -detailed-exitcode
#    verify proves convergence, and netcli pushes the declared config to the
#    FRR routers with post-change evidence asserted.
#  * "IaC: Ansible router drift remediation" is a WHILE loop that audits the
#    routers' running config with netcli, and while non-compliant runs an
#    Ansible raw/vtysh remediation playbook (the routers' SSH shell IS vtysh,
#    so raw blocks need no python on the device). max_iterations routes to a
#    manual-intervention terminal.
#
# NOTE: the Ansible server flow needs the lab-host image with python3 + sudo
# (src/files/lab/host/Dockerfile) — re-run "Lab: Provision and tear down demo
# datacenter" after updating the demo data so the image is rebuilt.

schema_version: 2

flows:
  - name: "IaC: Ansible server baseline rollout"
    description: >-
      Roll the golden server baseline across the lab's Linux hosts one host at
      a time with Ansible (SSH + become, standards resolved from org
      variables). A failing host halts the rollout immediately via the loop's
      break edge — run variables record the host being processed and how many
      completed — and a report step summarizes the hosts the loop collected.
    definition:
      graph:
        nodes:
          - id: start
            name: Start
            type: start
            position_x: 0
            position_y: 240
          - id: sv_init
            name: Init rollout state
            type: set_vars
            position_x: 200
            position_y: 240
            assignments:
              - name: rolled_out
                expr: "0"
              - name: current_host
                expr: "''"
          - id: rollout
            name: For each server
            type: loop
            loop_mode: for_each
            items_expr: "inputs.baseline_hosts"
            max_iterations: 16
            collect: "loop.item"
            position_x: 600
            position_y: 80
            width: 1280
            height: 340
          - id: sv_mark
            name: Mark current host
            type: set_vars
            scope_id: rollout
            position_x: 60
            position_y: 100
            assignments:
              - name: current_host
                expr: "loop.item"
          - id: apply_baseline
            name: Apply server baseline
            type: step
            kind: EXECUTE
            phase: IMPLEMENTATION
            handler: container.run
            scope_id: rollout
            position_x: 460
            position_y: 100
            mounted_files:
              - hosts.ini
              - baseline.yml
              - rolling.sh
            params:
              image: alpine:3.22
              working_dir: /workspace
              timeout_seconds: 300
              command:
                - sh /attachments/rolling.sh
              env:
                TARGET_HOST: "{{ loop.item }}"
                LAB_USER: "{{ secret('vault://orgs/default/secrets/meridian/lab/ssh/username') }}"
                LAB_PASSWORD: "{{ secret('vault://orgs/default/secrets/meridian/lab/ssh/password') }}"
                TENANT_NAME: "{{ vars.TENANT_NAME }}"
                NTP_PRIMARY: "{{ vars.NTP_PRIMARY }}"
                DNS_PRIMARY: "{{ vars.DNS_PRIMARY }}"
                SYSLOG_PRIMARY: "{{ vars.SYSLOG_PRIMARY }}"
            policy:
              timeout_sec: 330
              retries: 0
              on_failure: CONTINUE
              evidence_required: false
          - id: sv_ok
            name: Count host done
            type: set_vars
            scope_id: rollout
            position_x: 840
            position_y: 100
            assignments:
              - name: rolled_out
                expr: "(run.vars.rolled_out | default(0) | int) + 1"
          - id: rollout_end
            name: Loop End
            type: loop_end
            loop_ref: rollout
            scope_id: rollout
            position_x: 1202
            position_y: 306
          - id: report
            name: Rollout report
            type: step
            kind: EXECUTE
            phase: VERIFY
            handler: container.run
            position_x: 2000
            position_y: 200
            params:
              image: alpine:3.22
              working_dir: /workspace
              timeout_seconds: 60
              command:
                - |
                  mkdir -p /artifacts/new
                  {
                    echo "Ansible server baseline rollout"
                    echo "Hosts baselined (${COUNT}): ${BASELINED}"
                  } | tee /artifacts/new/rollout-report.txt
              env:
                BASELINED: "{{ steps.rollout.output.results | join(', ') }}"
                COUNT: "{{ run.vars.rolled_out | default(0) }}"
            policy:
              timeout_sec: 90
              retries: 0
              on_failure: CONTINUE
              evidence_required: false
          - id: ok
            name: Rollout complete
            type: terminal
            terminal_status: success
            position_x: 2420
            position_y: 210
          - id: halted
            name: Rollout halted
            type: terminal
            terminal_status: failure
            position_x: 2000
            position_y: 480
        edges:
          - id: e_start_init
            source: start:start
            target: sv_init
          - id: e_init_rollout
            source: sv_init:success
            target: rollout
          - id: e_rollout_mark
            source: rollout:iterate
            target: sv_mark
          - id: e_mark_apply
            source: sv_mark:success
            target: apply_baseline
          - id: e_apply_ok
            source: apply_baseline:success
            target: sv_ok
          - id: e_ok_end
            source: sv_ok:success
            target: rollout_end
          # The canary break: a failing host exits the loop and halts the run.
          - id: e_apply_halt
            source: apply_baseline:failure
            target: halted
          - id: e_rollout_report
            source: rollout:done
            target: report
          - id: e_rollout_max
            source: rollout:max_iterations
            target: halted
          - id: e_report_ok
            source: report:success
            target: ok
          - id: e_report_failed
            source: report:failure
            target: halted
      interface_graph:
        nodes:
          - id: sec_targets
            kind: section
            position_x: 80
            position_y: 80
            width: 520
            height: 200
            data:
              label: Servers
              runtime_layout: card
              collapsible: false
          - id: f_hosts
            kind: field
            parent_id: sec_targets
            position_x: 40
            position_y: 60
            data:
              label: Servers to baseline
              field_id: baseline_hosts
              field_type: inventory.device
              required: true
              description: >-
                Lab Linux servers, baselined strictly in this order — the
                rollout stops at the first failure.
              default_value:
                - dc1-srv-01
                - dc2-srv-01
                - br1-srv-01
                - br2-srv-01
              config:
                role: baseline_targets
                multiple: true
                option_source:
                  kind: inventory.devices
        edges: []

  - name: "IaC: Terraform router service"
    description: >-
      Declare a routed service loopback in Terraform (offline, builtin
      resources, state in the run's shared workspace), then switch on the
      requested action: plan-only stops after the reviewable plan artifact,
      apply is approval-gated and followed by a -detailed-exitcode
      convergence check before netcli pushes the declared config to the
      routers and asserts the post-change evidence.
    definition:
      graph:
        nodes:
          - id: start
            name: Start
            type: start
            position_x: 0
            position_y: 280
          - id: plan
            name: terraform plan
            type: step
            kind: CHECK
            phase: PREPARE
            handler: container.run
            execution_affinity: shared
            position_x: 200
            position_y: 280
            mounted_files:
              - service.tf
              - plan.sh
            params:
              image: hashicorp/terraform:1.9
              entrypoint: /bin/sh
              working_dir: /workspace
              timeout_seconds: 240
              command:
                - sh /attachments/plan.sh
              env:
                TF_VAR_service_name: "{{ inputs.service_name }}"
                TF_VAR_service_prefix: "{{ inputs.service_prefix }}"
                TF_VAR_routers: "{{ inputs.tf_targets | tojson }}"
            policy:
              timeout_sec: 300
              retries: 0
              on_failure: CONTINUE
              evidence_required: false
          - id: route
            name: Requested action?
            type: branch
            branch_mode: value
            value_expr: "inputs.tf_action"
            position_x: 620
            position_y: 270
            cases:
              - id: c_plan
                label: Plan only
                equals: plan
              - id: c_apply
                label: Plan and apply
                equals: apply
          - id: plan_done
            name: Plan reviewed
            type: terminal
            terminal_status: success
            position_x: 970
            position_y: 80
          - id: gate
            name: Approve apply
            type: approval
            phase: IMPLEMENTATION
            position_x: 970
            position_y: 270
            params:
              title: Approve Terraform apply
              message: >-
                Review the terraform-plan.txt artifact on the plan step, then
                approve to apply the saved plan and push the declared service
                loopback to the selected routers.
              timeout_seconds: 3600
            policy:
              timeout_sec: 3600
              retries: 0
              on_failure: FAIL_RUN
              evidence_required: false
          - id: apply
            name: terraform apply
            type: step
            kind: ACTION
            phase: IMPLEMENTATION
            handler: container.run
            execution_affinity: shared
            position_x: 1440
            position_y: 270
            mounted_files:
              - apply.sh
            params:
              image: hashicorp/terraform:1.9
              entrypoint: /bin/sh
              working_dir: /workspace
              timeout_seconds: 240
              command:
                - sh /attachments/apply.sh
            policy:
              timeout_sec: 300
              retries: 0
              on_failure: CONTINUE
              evidence_required: false
          - id: tf_verify
            name: Convergence check
            type: step
            kind: CHECK
            phase: VERIFY
            handler: container.run
            execution_affinity: shared
            position_x: 1860
            position_y: 270
            mounted_files:
              - verify.sh
            params:
              image: hashicorp/terraform:1.9
              entrypoint: /bin/sh
              working_dir: /workspace
              timeout_seconds: 240
              command:
                - sh /attachments/verify.sh
              env:
                TF_VAR_service_name: "{{ inputs.service_name }}"
                TF_VAR_service_prefix: "{{ inputs.service_prefix }}"
                TF_VAR_routers: "{{ inputs.tf_targets | tojson }}"
            policy:
              timeout_sec: 300
              retries: 0
              on_failure: CONTINUE
              evidence_required: false
          - id: push
            name: Push config to routers
            type: step
            kind: ACTION
            phase: IMPLEMENTATION
            handler: netcli.execute
            position_x: 2280
            position_y: 270
            target_selectors:
              - type: role
                role: tf_targets
            params:
              commands:
                - configure terminal
                - interface lo
                - "description svc {{ inputs.service_name }} managed-by-terraform"
                - "ip address {{ inputs.service_prefix }}/32"
                - end
            policy:
              timeout_sec: 120
              retries: 0
              on_failure: CONTINUE
              evidence_required: false
          - id: postcheck
            name: Post-change evidence
            type: step
            kind: CHECK
            phase: VERIFY
            handler: netcli.collect_evidence
            position_x: 2700
            position_y: 270
            target_selectors:
              - type: role
                role: tf_targets
            params:
              commands:
                - show running-config
            policy:
              timeout_sec: 120
              retries: 0
              on_failure: CONTINUE
              evidence_required: true
          - id: confirm
            name: Declared config present?
            type: step
            kind: CHECK
            phase: VERIFY
            handler: evidence.assert
            position_x: 3120
            position_y: 270
            params:
              artifact_step_id: postcheck
              target_role: tf_targets
              command: show running-config
              operator: contains
              expected: "svc {{ inputs.service_name }} managed-by-terraform"
              message: A target router does not carry the declared service loopback.
            policy:
              timeout_sec: 60
              retries: 0
              on_failure: CONTINUE
              evidence_required: false
          - id: done
            name: Service deployed
            type: terminal
            terminal_status: success
            position_x: 3540
            position_y: 180
          - id: failed
            name: Deployment failed
            type: terminal
            terminal_status: failure
            position_x: 1700
            position_y: 600
        edges:
          - id: e_start_plan
            source: start:start
            target: plan
          - id: e_plan_route
            source: plan:success
            target: route
          - id: e_plan_failed
            source: plan:failure
            target: failed
          - id: e_route_plan_only
            source: "route:case:c_plan"
            target: plan_done
          - id: e_route_apply
            source: "route:case:c_apply"
            target: gate
          - id: e_route_else
            source: route:else
            target: failed
          - id: e_route_error
            source: route:error
            target: failed
          - id: e_gate_apply
            source: gate:approved
            target: apply
          - id: e_gate_rejected
            source: gate:rejected
            target: failed
          - id: e_gate_expired
            source: gate:expired
            target: failed
          - id: e_apply_verify
            source: apply:success
            target: tf_verify
          - id: e_apply_failed
            source: apply:failure
            target: failed
          - id: e_verify_push
            source: tf_verify:success
            target: push
          - id: e_verify_failed
            source: tf_verify:failure
            target: failed
          - id: e_push_postcheck
            source: push:success
            target: postcheck
          - id: e_push_failed
            source: push:failure
            target: failed
          - id: e_postcheck_confirm
            source: postcheck:success
            target: confirm
          - id: e_postcheck_failed
            source: postcheck:failure
            target: failed
          - id: e_confirm_done
            source: confirm:success
            target: done
          - id: e_confirm_failed
            source: confirm:failure
            target: failed
      interface_graph:
        nodes:
          - id: sec_action
            kind: section
            position_x: 80
            position_y: 80
            width: 440
            height: 180
            data:
              label: Action
              runtime_layout: card
              collapsible: false
          - id: f_action
            kind: field
            parent_id: sec_action
            position_x: 40
            position_y: 60
            data:
              label: Terraform action
              field_id: tf_action
              field_type: core.enum
              required: true
              default_value: plan
              description: Plan-only stops after the reviewable plan artifact.
              config:
                option_source:
                  kind: core.static
                  static_options:
                    - value: plan
                      label: Plan only
                    - value: apply
                      label: Plan and apply (approval-gated)
          - id: sec_service
            kind: section
            position_x: 560
            position_y: 80
            width: 520
            height: 220
            data:
              label: Service
              runtime_layout: card
              collapsible: false
          - id: f_service_name
            kind: field
            parent_id: sec_service
            position_x: 40
            position_y: 60
            data:
              label: Service name
              field_id: service_name
              field_type: core.text
              required: true
              default_value: telemetry
              description: Short identifier stamped into the interface description.
              config:
                validations:
                  combinator: AND
                  children:
                    - id: v_name
                      op: regex
                      operand:
                        kind: value
                        value: "^[a-z][a-z0-9-]{1,20}$"
          - id: f_service_prefix
            kind: field
            parent_id: sec_service
            position_x: 300
            position_y: 60
            data:
              label: Service address
              field_id: service_prefix
              field_type: core.text
              required: true
              default_value: "10.210.10.1"
              description: Host address for the service loopback (pushed as a /32).
              config:
                validations:
                  combinator: AND
                  children:
                    - id: v_prefix
                      op: regex
                      operand:
                        kind: value
                        value: "^10\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$"
          - id: sec_targets
            kind: section
            position_x: 1140
            position_y: 80
            width: 480
            height: 180
            data:
              label: Target routers
              runtime_layout: card
              collapsible: false
          - id: f_targets
            kind: field
            parent_id: sec_targets
            position_x: 40
            position_y: 60
            data:
              label: Routers
              field_id: tf_targets
              field_type: inventory.device
              required: true
              description: Routers that must carry the service loopback.
              default_value:
                - dc1-core-01
                - dc2-core-01
              config:
                role: tf_targets
                multiple: true
                option_source:
                  kind: inventory.devices
        edges: []

  - name: "IaC: Ansible router drift remediation"
    description: >-
      Audit the selected FRR routers for the golden loopback description and,
      while any router drifts, remediate with an Ansible raw/vtysh playbook —
      re-auditing each pass until the fleet converges or the loop's iteration
      cap routes to a manual-intervention terminal. Run variables count the
      passes and record the verdict.
    definition:
      graph:
        nodes:
          - id: start
            name: Start
            type: start
            position_x: 0
            position_y: 280
          - id: sv_init
            name: Init audit state
            type: set_vars
            position_x: 200
            position_y: 280
            assignments:
              - name: compliant
                expr: "false"
              - name: passes
                expr: "0"
          - id: fix_loop
            name: Until compliant
            type: loop
            loop_mode: while
            condition: "not (run.vars.compliant | default(false))"
            max_iterations: 3
            position_x: 620
            position_y: 60
            width: 1640
            height: 460
          - id: audit
            name: Audit running config
            type: step
            kind: CHECK
            phase: VERIFY
            handler: netcli.collect_evidence
            scope_id: fix_loop
            position_x: 60
            position_y: 100
            target_selectors:
              - type: role
                role: drift_targets
            params:
              commands:
                - show running-config
            policy:
              timeout_sec: 120
              retries: 0
              on_failure: CONTINUE
              evidence_required: true
          - id: check
            name: Golden description present?
            type: step
            kind: CHECK
            phase: VERIFY
            handler: evidence.assert
            scope_id: fix_loop
            position_x: 440
            position_y: 100
            params:
              artifact_step_id: audit
              target_role: drift_targets
              command: show running-config
              operator: contains
              expected: managed by Meridian NetOps
              message: At least one router lacks the golden loopback description.
            policy:
              timeout_sec: 60
              retries: 0
              on_failure: CONTINUE
              evidence_required: false
          - id: sv_done
            name: Mark compliant
            type: set_vars
            scope_id: fix_loop
            position_x: 820
            position_y: 60
            assignments:
              - name: compliant
                expr: "true"
              - name: passes
                expr: "(run.vars.passes | default(0) | int) + 1"
          - id: remediate
            name: Ansible remediation
            type: step
            kind: EXECUTE
            phase: IMPLEMENTATION
            handler: container.run
            scope_id: fix_loop
            position_x: 820
            position_y: 260
            mounted_files:
              - routers.ini
              - remediate.yml
              - remediate.sh
            params:
              image: alpine:3.22
              working_dir: /workspace
              timeout_seconds: 300
              command:
                - sh /attachments/remediate.sh
              env:
                LIMIT_HOSTS: "{{ inputs.drift_targets | join(',') }}"
                LAB_USER: "{{ secret('vault://orgs/default/secrets/meridian/lab/ssh/username') }}"
                LAB_PASSWORD: "{{ secret('vault://orgs/default/secrets/meridian/lab/ssh/password') }}"
            policy:
              timeout_sec: 330
              retries: 0
              on_failure: CONTINUE
              evidence_required: false
          - id: sv_retry
            name: Mark drifting
            type: set_vars
            scope_id: fix_loop
            position_x: 1200
            position_y: 260
            assignments:
              - name: compliant
                expr: "false"
              - name: passes
                expr: "(run.vars.passes | default(0) | int) + 1"
          - id: fix_end
            name: Loop End
            type: loop_end
            loop_ref: fix_loop
            scope_id: fix_loop
            position_x: 1562
            position_y: 426
          - id: converged
            name: Fleet compliant
            type: terminal
            terminal_status: success
            position_x: 2380
            position_y: 240
          - id: manual
            name: Manual intervention required
            type: terminal
            terminal_status: failure
            position_x: 2380
            position_y: 440
        edges:
          - id: e_start_init
            source: start:start
            target: sv_init
          - id: e_init_loop
            source: sv_init:success
            target: fix_loop
          - id: e_loop_audit
            source: fix_loop:iterate
            target: audit
          - id: e_audit_check
            source: audit:success
            target: check
          # Collection failure (e.g. unreachable router) counts as a drifting
          # pass and retries on the next iteration.
          - id: e_audit_retry
            source: audit:failure
            target: sv_retry
          - id: e_check_done
            source: check:success
            target: sv_done
          - id: e_check_remediate
            source: check:failure
            target: remediate
          - id: e_remediate_retry
            source: remediate:success
            target: sv_retry
          - id: e_remediate_failed
            source: remediate:failure
            target: sv_retry
          - id: e_done_end
            source: sv_done:success
            target: fix_end
          - id: e_retry_end
            source: sv_retry:success
            target: fix_end
          - id: e_loop_converged
            source: fix_loop:done
            target: converged
          - id: e_loop_manual
            source: fix_loop:max_iterations
            target: manual
      interface_graph:
        nodes:
          - id: sec_targets
            kind: section
            position_x: 80
            position_y: 80
            width: 520
            height: 200
            data:
              label: Routers
              runtime_layout: card
              collapsible: false
          - id: f_targets
            kind: field
            parent_id: sec_targets
            position_x: 40
            position_y: 60
            data:
              label: Routers to audit
              field_id: drift_targets
              field_type: inventory.device
              required: true
              description: >-
                FRR routers audited for the golden loopback description — the
                core fabric, preselected. Remediation is limited to this
                selection.
              default_value:
                - dc1-core-01
                - dc1-core-02
                - dc2-core-01
                - dc2-core-02
              config:
                role: drift_targets
                multiple: true
                option_source:
                  kind: inventory.devices
        edges: []

flow_attachments:
  - flow: "IaC: Ansible server baseline rollout"
    filename: hosts.ini
    content_file: src/files/ansible/hosts.ini
  - flow: "IaC: Ansible server baseline rollout"
    filename: baseline.yml
    content_file: src/files/ansible/baseline.yml
  - flow: "IaC: Ansible server baseline rollout"
    filename: rolling.sh
    content_file: src/files/ansible/rolling.sh
  - flow: "IaC: Terraform router service"
    filename: service.tf
    content_file: src/files/terraform/service.tf
  - flow: "IaC: Terraform router service"
    filename: plan.sh
    content_file: src/files/terraform/plan.sh
  - flow: "IaC: Terraform router service"
    filename: apply.sh
    content_file: src/files/terraform/apply.sh
  - flow: "IaC: Terraform router service"
    filename: verify.sh
    content_file: src/files/terraform/verify.sh
  - flow: "IaC: Ansible router drift remediation"
    filename: routers.ini
    content_file: src/files/ansible/routers.ini
  - flow: "IaC: Ansible router drift remediation"
    filename: remediate.yml
    content_file: src/files/ansible/remediate.yml
  - flow: "IaC: Ansible router drift remediation"
    filename: remediate.sh
    content_file: src/files/ansible/remediate.sh
