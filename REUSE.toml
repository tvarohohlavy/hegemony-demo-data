version = 1
SPDX-PackageName = "hegemony-demo-data"
SPDX-PackageSupplier = "Jakub Travnik <jakub.travnik@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/hegemony-sh/hegemony-demo-data"

[[annotations]]
path = "dist/*.yaml"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Jakub Travnik <jakub.travnik@gmail.com>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "uv.lock"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Jakub Travnik <jakub.travnik@gmail.com>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# FRR reads these files verbatim as /etc/frr/*.conf; keep them free of SPDX
# comment headers and annotate them here instead.
[[annotations]]
path = ["src/files/lab/frr/*.conf", "src/files/lab/frr/vtysh.conf"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Jakub Travnik <jakub.travnik@gmail.com>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# CSV option-source data parsed row-by-row by the flow form (attachment.csv);
# a comment header would be read as data, so annotate it here instead.
[[annotations]]
path = "src/files/lab/*.csv"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Jakub Travnik <jakub.travnik@gmail.com>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Binary demo artifact seeded into the Golden Artifacts bucket (plus its
# copy under dist/seed-s3); binaries cannot carry SPDX comment headers.
[[annotations]]
path = ["src/files/standards/golden/*.bin", "dist/seed-s3/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Jakub Travnik <jakub.travnik@gmail.com>"
SPDX-License-Identifier = "AGPL-3.0-or-later"
