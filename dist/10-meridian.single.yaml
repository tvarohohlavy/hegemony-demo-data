- flow: 'Lab: Provision and tear down demo datacenter'
  filename: seed.sh
  content: "#!/bin/sh\n# SPDX-FileCopyrightText: 2025-2026 Jakub Trávník <jakub.travnik@gmail.com>\n# SPDX-License-Identifier:\
    \ AGPL-3.0-or-later\n#\n# Provision the demo Gitea so the backup integrations have somewhere to push:\n# wait for health,\
    \ create the admin account and a public org, then create the\n# auto-initialised backup repositories:\n#   * config-backups\
    \   — pushed to by the \"Ops: Backup lab configs to Git\" flow\n#                        from inside its own container\
    \ (HTTP basic auth).\n#   * flow-backups     — Hegemony's native flow Git-sync writes flow definitions\n#            \
    \            here (see the flow's Git section in the demo bundle).\n#   * platform-backups — the \"Meridian platform config\
    \ backup\" Platform Sync\n#                        profile (imported from the bundle) exports platform\n#            \
    \            config here; run its export from the Platform Sync UI.\n#\n# The two native-write repos need a credential:\
    \ Hegemony authenticates git over\n# HTTP by sending the fixed username \"x-access-token\" and a secret value as the\n\
    # Basic-auth password. Rather than mint an access token (a random value that\n# would have to be captured and stored —\
    \ and must never reach run/container\n# logs), this seed provisions a dedicated Gitea SERVICE ACCOUNT literally named\n\
    # \"x-access-token\" whose password IS the meridian-gitea-token secret, and grants\n# it write on the two backup repos.\
    \ Gitea, seeing a password that is not an\n# access token, falls back to a normal username+password login — so the backups\n\
    # authenticate out of the box with no token to mint or print. The password comes\n# in as WRITE_PASSWORD (resolved from\
    \ the same secret Hegemony reads), so the two\n# ends always match.\n# Idempotent — safe to re-run.\nset -e\n\nGITEA_CONTAINER=\"\
    ${GITEA_CONTAINER:-meridian-gitea}\"\nBASE=\"${GITEA_URL:-http://dind:3000}\"\nADMIN_USER=\"${ADMIN_USER:-meridian-admin}\"\
    \nADMIN_PASSWORD=\"${ADMIN_PASSWORD:-demo-gitea-admin-password}\"\nORG=\"${GITEA_ORG:-meridian}\"\n# The service account\
    \ Hegemony authenticates as. Its name MUST equal the fixed\n# username Hegemony's git client sends (see apps/api/services/git_ops.py).\n\
    GIT_USER=\"x-access-token\"\nWRITE_PASSWORD=\"${WRITE_PASSWORD:-}\"\n\n# Feed the admin credentials to curl through a\
    \ config file (-K) instead of -u,\n# and request bodies through a file (--data @) instead of -d, so neither the\n# password\
    \ nor the JSON payload (which itself may carry a password) ever appears\n# in the process argument list. mktemp yields\
    \ a private (0600) file; it is\n# removed when the script exits.\nCURL_AUTH_CONFIG=$(mktemp 2>/dev/null) || {\n  echo\
    \ \"ERROR: cannot create a secure temporary file for curl authentication\" >&2\n  exit 1\n}\ntrap 'rm -f \"${CURL_AUTH_CONFIG}\"\
    ' EXIT\nprintf 'user = \"%s:%s\"\\n' \"${ADMIN_USER}\" \"${ADMIN_PASSWORD}\" >\"${CURL_AUTH_CONFIG}\"\n\n# Call a Gitea\
    \ API endpoint with the admin credentials. A genuine duplicate is\n# an idempotent success, but a 422 is ambiguous — Gitea\
    \ returns it both for\n# \"already exists\" AND for real validation errors (bad password, invalid name),\n# so the body\
    \ is inspected and only an already-exists 422 is ignored; every\n# other 422 and any auth/network/server failure is surfaced.\
    \ Credentials and\n# request bodies travel via files (never argv), and Gitea does not reflect\n# submitted passwords in\
    \ responses, so nothing secret reaches logs or the\n# process table even when an error body is printed. Requests are time-bounded\
    \ so\n# a stalled endpoint cannot hang the seed.\n#   gitea_api \"<description>\" <METHOD> <url> [json-body]\ngitea_api()\
    \ {\n  desc=\"$1\"\n  method=\"$2\"\n  url=\"$3\"\n  data=\"$4\"\n  echo \"Provisioning ${desc} (idempotent) ...\"\n \
    \ body_file=$(mktemp 2>/dev/null) || {\n    echo \"ERROR: cannot create a secure temporary response file\" >&2\n    return\
    \ 1\n  }\n  if [ -n \"${data}\" ]; then\n    data_file=$(mktemp 2>/dev/null) || {\n      echo \"ERROR: cannot create a\
    \ secure temporary request file\" >&2\n      rm -f \"${body_file}\"\n      return 1\n    }\n    printf '%s' \"${data}\"\
    \ >\"${data_file}\"\n    status=$(curl -sS -K \"${CURL_AUTH_CONFIG}\" --connect-timeout 10 --max-time 60 \\\n      -X\
    \ \"${method}\" \"${url}\" \\\n      -H 'Content-Type: application/json' --data @\"${data_file}\" \\\n      -o \"${body_file}\"\
    \ -w '%{http_code}') || {\n      echo \"ERROR: request for ${desc} failed (network/connection)\" >&2\n      rm -f \"${body_file}\"\
    \ \"${data_file}\"\n      return 1\n    }\n    rm -f \"${data_file}\"\n  else\n    status=$(curl -sS -K \"${CURL_AUTH_CONFIG}\"\
    \ --connect-timeout 10 --max-time 60 \\\n      -X \"${method}\" \"${url}\" \\\n      -o \"${body_file}\" -w '%{http_code}')\
    \ || {\n      echo \"ERROR: request for ${desc} failed (network/connection)\" >&2\n      rm -f \"${body_file}\"\n    \
    \  return 1\n    }\n  fi\n  rc=0\n  case \"${status}\" in\n    200 | 201 | 204) echo \"  ${desc}: ok (HTTP ${status}).\"\
    \ ;;\n    409) echo \"  ${desc}: already exists; continuing.\" ;;\n    422)\n      if grep -qiE 'already (exists|taken|used)'\
    \ \"${body_file}\"; then\n        echo \"  ${desc}: already exists; continuing.\"\n      else\n        echo \"ERROR: ${desc}\
    \ returned HTTP 422: $(cat \"${body_file}\")\" >&2\n        rc=1\n      fi\n      ;;\n    *)\n      echo \"ERROR: ${desc}\
    \ returned HTTP ${status}: $(cat \"${body_file}\")\" >&2\n      rc=1\n      ;;\n  esac\n  rm -f \"${body_file}\"\n  return\
    \ \"${rc}\"\n}\n\necho \"Waiting for Gitea at ${BASE} ...\"\nHEALTHY=false\nfor _ in $(seq 1 60); do\n  if curl -fsS --connect-timeout\
    \ 5 --max-time 10 \"${BASE}/api/healthz\" >/dev/null 2>&1; then\n    echo \"Gitea is healthy.\"\n    HEALTHY=true\n  \
    \  break\n  fi\n  sleep 2\ndone\nif [ \"${HEALTHY}\" != \"true\" ]; then\n  echo \"ERROR: Gitea did not become healthy\
    \ within 120s\" >&2\n  exit 1\nfi\n\necho \"Creating admin user ${ADMIN_USER} (idempotent) ...\"\n# The first admin must\
    \ be bootstrapped with Gitea's CLI (the API needs an\n# existing admin to authenticate). The CLI has no password-stdin\
    \ option, so this\n# one call passes the password as an argument; it runs inside the disposable\n# Gitea container with\
    \ a synthetic demo credential. Every subsequent API call\n# keeps credentials out of argv (see gitea_api above).\ndocker\
    \ exec \"${GITEA_CONTAINER}\" gitea admin user create \\\n  --username \"${ADMIN_USER}\" \\\n  --password \"${ADMIN_PASSWORD}\"\
    \ \\\n  --email \"${ADMIN_USER}@meridian.example\" \\\n  --admin --must-change-password=false \\\n  || echo \"admin user\
    \ already exists; continuing\"\n\ngitea_api \"org ${ORG}\" POST \"${BASE}/api/v1/orgs\" \\\n  \"{\\\"username\\\":\\\"\
    ${ORG}\\\",\\\"visibility\\\":\\\"public\\\"}\"\n\nfor REPO in config-backups flow-backups platform-backups; do\n  gitea_api\
    \ \"${REPO} repository\" POST \"${BASE}/api/v1/orgs/${ORG}/repos\" \\\n    \"{\\\"name\\\":\\\"${REPO}\\\",\\\"private\\\
    \":false,\\\"auto_init\\\":true,\\\"default_branch\\\":\\\"main\\\"}\"\ndone\n\n# --- Native-write backups: the Hegemony\
    \ service account -------------------\n# Provision the \"x-access-token\" account and give it write on the two repos\n\
    # Hegemony pushes to. With no real password we cannot create the account, so\n# skip gracefully (the anonymous reads still\
    \ work; only the pushes would fail).\nif [ -z \"${WRITE_PASSWORD}\" ] || [ \"${WRITE_PASSWORD}\" = \"DEMO_GITEA_WRITE_TOKEN_PLACEHOLDER\"\
    \ ]; then\n  echo \"meridian-gitea-token is unset/placeholder; skipping the ${GIT_USER} service account.\"\n  echo \"\
    \  Set the meridian-gitea-token secret and re-run the Lab flow to enable native git backups.\"\nelse\n  gitea_api \"service\
    \ account ${GIT_USER}\" POST \"${BASE}/api/v1/admin/users\" \\\n    \"{\\\"username\\\":\\\"${GIT_USER}\\\",\\\"full_name\\\
    \":\\\"Hegemony backup service account\\\",\\\"email\\\":\\\"${GIT_USER}@meridian.example\\\",\\\"password\\\":\\\"${WRITE_PASSWORD}\\\
    \",\\\"must_change_password\\\":false}\"\n  # Converge the password to the current secret value on every run, so rotating\n\
    \  # the secret and re-running the flow keeps the two ends in sync.\n  gitea_api \"service account password\" PATCH \"\
    ${BASE}/api/v1/admin/users/${GIT_USER}\" \\\n    \"{\\\"login_name\\\":\\\"${GIT_USER}\\\",\\\"source_id\\\":0,\\\"password\\\
    \":\\\"${WRITE_PASSWORD}\\\",\\\"must_change_password\\\":false}\"\n  for REPO in flow-backups platform-backups; do\n\
    \    gitea_api \"write access to ${REPO}\" PUT \\\n      \"${BASE}/api/v1/repos/${ORG}/${REPO}/collaborators/${GIT_USER}\"\
    \ \\\n      \"{\\\"permission\\\":\\\"write\\\"}\"\n  done\nfi\n\necho \"Gitea seeded: ${BASE}/${ORG}/{config-backups,flow-backups,platform-backups}\"\
    \necho \"  flow-backups and platform-backups are writable by Hegemony out of the box:\"\necho \"  the ${GIT_USER} service\
    \ account authenticates with the meridian-gitea-token\"\necho \"  secret as its password. Nothing secret is minted or\
    \ printed here.\"\n"
- flow: 'IaC: Ansible server baseline rollout'
  filename: hosts.ini
  content: '# SPDX-FileCopyrightText: 2025-2026 Jakub Travnik <jakub.travnik@gmail.com>

    # SPDX-License-Identifier: AGPL-3.0-or-later

    #

    # Static Ansible inventory for the lab''s Linux endpoint hosts — the classic

    # checked-into-git inventory file. Addresses are the fixed containerlab

    # management IPs (topology.clab.yml); credentials are NOT stored here — the

    # flow injects them from the meridian-lab-ssh vault secret as extra vars.

    [lab_servers]

    dc1-srv-01 ansible_host=172.20.30.15

    dc2-srv-01 ansible_host=172.20.30.44

    br1-srv-01 ansible_host=172.20.30.23

    br2-srv-01 ansible_host=172.20.30.33


    [lab_servers:vars]

    ansible_connection=ssh

    ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

    '
- flow: 'IaC: Ansible server baseline rollout'
  filename: baseline.yml
  content: "# SPDX-FileCopyrightText: 2025-2026 Jakub Travnik <jakub.travnik@gmail.com>\n# SPDX-License-Identifier: AGPL-3.0-or-later\n\
    #\n# Server baseline playbook applied host-by-host by the \"IaC: Ansible server\n# baseline rollout\" flow (one loop iteration\
    \ = one host via --limit). Ordinary\n# config management: escalate with become, stamp the org's golden standards\n# (resolved\
    \ by the flow from {{ vars.* }} and passed as environment variables)\n# into /etc, and leave a login banner — all idempotent,\
    \ so re-runs report ok.\n- name: Meridian server baseline\n  hosts: all\n  become: true\n  gather_facts: true\n  vars:\n\
    \    tenant: \"{{ lookup('env', 'TENANT_NAME') | default('Meridian', true) }}\"\n    ntp: \"{{ lookup('env', 'NTP_PRIMARY')\
    \ | default('', true) }}\"\n    dns: \"{{ lookup('env', 'DNS_PRIMARY') | default('', true) }}\"\n    syslog: \"{{ lookup('env',\
    \ 'SYSLOG_PRIMARY') | default('', true) }}\"\n  tasks:\n    - name: Ensure the baseline directory exists\n      ansible.builtin.file:\n\
    \        path: /etc/meridian\n        state: directory\n        mode: \"0755\"\n\n    - name: Render the golden-standards\
    \ baseline file\n      ansible.builtin.copy:\n        dest: /etc/meridian/baseline.env\n        mode: \"0644\"\n     \
    \   content: |\n          # Managed by Hegemony — IaC: Ansible server baseline rollout\n          TENANT={{ tenant }}\n\
    \          NTP_PRIMARY={{ ntp }}\n          DNS_PRIMARY={{ dns }}\n          SYSLOG_PRIMARY={{ syslog }}\n\n    - name:\
    \ Stamp the login banner\n      ansible.builtin.copy:\n        dest: /etc/motd\n        mode: \"0644\"\n        content:\
    \ |\n          {{ tenant }} lab server {{ inventory_hostname }} — baseline managed by Ansible.\n          Golden standards:\
    \ NTP {{ ntp | default('<unset>', true) }} / DNS {{ dns | default('<unset>', true) }} / syslog {{ syslog | default('<unset>',\
    \ true) }}\n\n    - name: Verify the baseline landed\n      ansible.builtin.command: cat /etc/meridian/baseline.env\n\
    \      register: baseline_check\n      changed_when: false\n\n    - name: Assert the baseline records this tenant\n  \
    \    ansible.builtin.assert:\n        that:\n          - \"('TENANT=' + tenant) in baseline_check.stdout\"\n        success_msg:\
    \ \"Baseline present on {{ inventory_hostname }}.\"\n        fail_msg: \"Baseline file on {{ inventory_hostname }} does\
    \ not record tenant {{ tenant }}.\"\n"
- flow: 'IaC: Ansible server baseline rollout'
  filename: rolling.sh
  content: "#!/bin/sh\n# SPDX-FileCopyrightText: 2025-2026 Jakub Travnik <jakub.travnik@gmail.com>\n# SPDX-License-Identifier:\
    \ AGPL-3.0-or-later\n#\n# One rolling-rollout iteration: run the server baseline playbook against a\n# single host from\
    \ the static inventory (--limit $TARGET_HOST — the flow's\n# loop passes {{ loop.item }}). Installs ansible-core + sshpass\
    \ into the\n# throwaway alpine container; credentials arrive as environment variables\n# resolved from the meridian-lab-ssh\
    \ vault secret and are handed to Ansible\n# as extra vars so they never land in the inventory file or argv of sshpass.\n\
    #\n# The playbook's exit code is captured explicitly (not piped through tee) —\n# it must reach the step verbatim: a failing\
    \ host is what trips the flow's\n# canary break edge and halts the rollout.\nset -eu\n\n: \"${TARGET_HOST:?TARGET_HOST\
    \ is required (the host to baseline)}\"\n: \"${LAB_USER:?LAB_USER is required}\"\n: \"${LAB_PASSWORD:?LAB_PASSWORD is\
    \ required}\"\n\napk add --no-cache ansible-core sshpass openssh-client >/dev/null\nmkdir -p /artifacts/new\n\nEXTRA_VARS=$(mktemp)\n\
    trap 'rm -f \"${EXTRA_VARS}\"' EXIT\ncat >\"${EXTRA_VARS}\" <<EOF\nansible_user: \"${LAB_USER}\"\nansible_password: \"\
    ${LAB_PASSWORD}\"\nansible_become_password: \"${LAB_PASSWORD}\"\nEOF\n\necho \"Applying server baseline to ${TARGET_HOST}\
    \ ...\"\nLOG=\"/artifacts/new/baseline-${TARGET_HOST}.txt\"\nrc=0\nansible-playbook \\\n  -i /attachments/hosts.ini \\\
    \n  --limit \"${TARGET_HOST}\" \\\n  -e \"@${EXTRA_VARS}\" \\\n  /attachments/baseline.yml >\"${LOG}\" 2>&1 || rc=$?\n\
    cat \"${LOG}\"\nexit \"${rc}\"\n"
- flow: 'IaC: Terraform router service'
  filename: service.tf
  content: "# SPDX-FileCopyrightText: 2025-2026 Jakub Travnik <jakub.travnik@gmail.com>\n# SPDX-License-Identifier: AGPL-3.0-or-later\n\
    #\n# Desired state for a routed lab service, used by the \"IaC: Terraform router\n# service\" flow: one terraform_data\
    \ resource per target router records the\n# service loopback each router must carry, and the rendered_config output is\n\
    # the exact vtysh command block the flow's netcli push step applies. Only the\n# builtin terraform_data resource is used,\
    \ so init/plan/apply run fully\n# offline (no provider downloads) with local state kept in the run's /shared\n# workspace\
    \ — plan genuinely diffs against the state apply wrote earlier in\n# the same run.\n\nvariable \"service_name\" {\n  type\
    \        = string\n  description = \"Short service identifier stamped into the interface description.\"\n}\n\nvariable\
    \ \"service_prefix\" {\n  type        = string\n  description = \"Host address the service loopback advertises (pushed\
    \ as a /32).\"\n}\n\nvariable \"routers\" {\n  type        = list(string)\n  description = \"Target routers that must\
    \ carry the service loopback.\"\n}\n\nresource \"terraform_data\" \"router_service\" {\n  for_each = toset(var.routers)\n\
    \n  input = {\n    router      = each.value\n    description = \"svc ${var.service_name} managed-by-terraform\"\n    address\
    \     = \"${var.service_prefix}/32\"\n  }\n}\n\noutput \"rendered_config\" {\n  description = \"Per-router vtysh command\
    \ block realizing the desired state.\"\n  value = {\n    for router, desired in terraform_data.router_service : router\
    \ => join(\"\\n\", [\n      \"interface lo\",\n      \" description ${desired.input.description}\",\n      \" ip address\
    \ ${desired.input.address}\",\n    ])\n  }\n}\n"
- flow: 'IaC: Terraform router service'
  filename: plan.sh
  content: '#!/bin/sh

    # SPDX-FileCopyrightText: 2025-2026 Jakub Travnik <jakub.travnik@gmail.com>

    # SPDX-License-Identifier: AGPL-3.0-or-later

    #

    # Stage the router-service config into the run''s /shared workspace and run

    # terraform init + plan there, saving the plan file for the apply step of the

    # same run (every container step of a run sees the same /shared). The

    # human-readable plan is captured as a run artifact for the approval gate''s

    # reviewer. Inputs arrive as TF_VAR_* environment variables.

    set -eu


    WORKDIR=/shared/tf

    mkdir -p "${WORKDIR}" /artifacts/new

    cp /attachments/service.tf "${WORKDIR}/service.tf"

    cd "${WORKDIR}"


    terraform init -input=false -no-color

    terraform plan -input=false -no-color -out=service.tfplan

    terraform show -no-color service.tfplan >/artifacts/new/terraform-plan.txt

    cat /artifacts/new/terraform-plan.txt

    '
- flow: 'IaC: Terraform router service'
  filename: apply.sh
  content: '#!/bin/sh

    # SPDX-FileCopyrightText: 2025-2026 Jakub Travnik <jakub.travnik@gmail.com>

    # SPDX-License-Identifier: AGPL-3.0-or-later

    #

    # Apply the exact plan the plan step saved into /shared earlier in this run —

    # never a fresh plan, so what the approver reviewed is what executes. The

    # resulting outputs (the per-router rendered config) land in the run

    # artifacts next to the plan.

    set -eu


    WORKDIR=/shared/tf

    cd "${WORKDIR}"

    mkdir -p /artifacts/new


    terraform apply -input=false -no-color service.tfplan

    terraform output -no-color >/artifacts/new/terraform-outputs.txt

    cat /artifacts/new/terraform-outputs.txt

    '
- flow: 'IaC: Terraform router service'
  filename: verify.sh
  content: "#!/bin/sh\n# SPDX-FileCopyrightText: 2025-2026 Jakub Travnik <jakub.travnik@gmail.com>\n# SPDX-License-Identifier:\
    \ AGPL-3.0-or-later\n#\n# Post-apply convergence check: terraform plan -detailed-exitcode against the\n# state apply just\
    \ wrote. Exit 0 = state matches the desired config (the step\n# succeeds); exit 2 = drift remains (surfaced as a step\
    \ failure so the flow\n# routes to its drift terminal); exit 1 = plan error.\nset -eu\n\nWORKDIR=/shared/tf\ncd \"${WORKDIR}\"\
    \nmkdir -p /artifacts/new\n\nrc=0\nterraform plan -input=false -no-color -detailed-exitcode \\\n  >/artifacts/new/terraform-verify.txt\
    \ 2>&1 || rc=$?\ncat /artifacts/new/terraform-verify.txt\n\ncase \"${rc}\" in\n  0) echo \"Converged: state matches the\
    \ desired configuration.\" ;;\n  2) echo \"Drift detected: the state does not match the desired configuration.\" >&2 ;;\n\
    \  *) echo \"terraform plan failed (exit ${rc}).\" >&2 ;;\nesac\nexit \"${rc}\"\n"
- flow: 'IaC: Ansible router drift remediation'
  filename: routers.ini
  content: '# SPDX-FileCopyrightText: 2025-2026 Jakub Travnik <jakub.travnik@gmail.com>

    # SPDX-License-Identifier: AGPL-3.0-or-later

    #

    # Static Ansible inventory for the lab''s FRR routers. Their SSH login shell IS

    # vtysh (see src/files/lab/Dockerfile), so playbooks drive them with raw tasks

    # only: each raw command string lands in `vtysh -c` — no python needed on the

    # routers, the standard pattern for network gear. Credentials are injected by

    # the flow from the meridian-lab-ssh vault secret as extra vars.

    [core]

    dc1-core-01 ansible_host=172.20.30.11

    dc1-core-02 ansible_host=172.20.30.12

    dc2-core-01 ansible_host=172.20.30.41

    dc2-core-02 ansible_host=172.20.30.42


    [edge]

    br1-edge-01 ansible_host=172.20.30.21

    br2-edge-01 ansible_host=172.20.30.31


    [access]

    dc1-acc-01 ansible_host=172.20.30.13

    dc1-acc-02 ansible_host=172.20.30.14

    dc2-acc-01 ansible_host=172.20.30.43

    br1-acc-01 ansible_host=172.20.30.22

    br2-acc-01 ansible_host=172.20.30.32


    [routers:children]

    core

    edge

    access


    [routers:vars]

    ansible_connection=ssh

    ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

    '
- flow: 'IaC: Ansible router drift remediation'
  filename: remediate.yml
  content: "# SPDX-FileCopyrightText: 2025-2026 Jakub Travnik <jakub.travnik@gmail.com>\n# SPDX-License-Identifier: AGPL-3.0-or-later\n\
    #\n# FRR router remediation playbook for the \"IaC: Ansible router drift\n# remediation\" flow. The routers' SSH login\
    \ shell is vtysh, so every raw\n# command string is executed by `vtysh -c` on the router — the python-free\n# pattern\
    \ real network fleets use. Embedded newlines in one raw block become\n# sequential vtysh commands, exactly like pasting\
    \ into the CLI. The flow's\n# while-loop re-audits with netcli after this play and iterates until the\n# running config\
    \ carries the golden loopback description.\n- name: Meridian router golden-config remediation\n  hosts: all\n  gather_facts:\
    \ false\n  tasks:\n    - name: Stamp the golden loopback description\n      ansible.builtin.raw: |\n        configure\
    \ terminal\n        interface lo\n        description managed by Meridian NetOps\n        end\n      changed_when: true\n\
    \n    - name: Read back the loopback config\n      ansible.builtin.raw: |\n        show running-config interface lo\n\
    \      register: lo_config\n      changed_when: false\n\n    - name: Assert the description is present\n      ansible.builtin.assert:\n\
    \        that:\n          - \"'managed by Meridian NetOps' in lo_config.stdout\"\n        success_msg: \"{{ inventory_hostname\
    \ }} carries the golden description.\"\n        fail_msg: \"{{ inventory_hostname }} still lacks the golden description.\"\
    \n"
- flow: 'IaC: Ansible router drift remediation'
  filename: remediate.sh
  content: "#!/bin/sh\n# SPDX-FileCopyrightText: 2025-2026 Jakub Travnik <jakub.travnik@gmail.com>\n# SPDX-License-Identifier:\
    \ AGPL-3.0-or-later\n#\n# One remediation pass: run the router remediation playbook against the\n# routers the launch\
    \ form selected (--limit $LIMIT_HOSTS, a comma-separated\n# device-name list the flow renders from its inputs). Same container\
    \ recipe\n# as rolling.sh; the exit code is captured explicitly so an unreachable or\n# still-drifting router fails the\
    \ step and the flow's while-loop retries.\nset -eu\n\n: \"${LIMIT_HOSTS:?LIMIT_HOSTS is required (comma-separated router\
    \ names)}\"\n: \"${LAB_USER:?LAB_USER is required}\"\n: \"${LAB_PASSWORD:?LAB_PASSWORD is required}\"\n\napk add --no-cache\
    \ ansible-core sshpass openssh-client >/dev/null\nmkdir -p /artifacts/new\n\nEXTRA_VARS=$(mktemp)\ntrap 'rm -f \"${EXTRA_VARS}\"\
    ' EXIT\ncat >\"${EXTRA_VARS}\" <<EOF\nansible_user: \"${LAB_USER}\"\nansible_password: \"${LAB_PASSWORD}\"\nEOF\n\necho\
    \ \"Remediating routers: ${LIMIT_HOSTS} ...\"\nLOG=\"/artifacts/new/remediation.txt\"\nrc=0\nansible-playbook \\\n  -i\
    \ /attachments/routers.ini \\\n  --limit \"${LIMIT_HOSTS}\" \\\n  -e \"@${EXTRA_VARS}\" \\\n  /attachments/remediate.yml\
    \ >\"${LOG}\" 2>&1 || rc=$?\ncat \"${LOG}\"\nexit \"${rc}\"\n"
variables:
- name: ORG_NAME
  value: Meridian Networks
  description: Fictional operator name surfaced in flow output and notifications.
- name: NOC_CONTACT
  value: noc@meridian.example
  description: Network Operations Center contact address for change records.
- name: MAINT_WINDOW
  value: Sun 02:00-04:00 UTC
  description: Standard maintenance window, recorded in backup manifests.
- name: GITEA_HOST
  value: dind
  description: Host that publishes the demo Gitea service. Gitea runs inside the platform's dind sandbox daemon and binds
    :3000 in the dind netns, so the compose-DNS name `dind` addresses it both from host-networked flow steps (which share
    that netns) and from the platform API. The dind service re-publishes the port to the operator's browser as localhost:3000.
- name: GITEA_PORT
  value: '3000'
  description: Published port of the demo Gitea service.
- name: GITEA_ORG
  value: meridian
  description: Gitea organisation that owns the source-of-truth and backup repos.
- name: GITEA_URL
  value: http://{{ vars.GITEA_HOST }}:{{ vars.GITEA_PORT }}
  description: Base URL of the demo Gitea service (composed from GITEA_HOST/PORT).
- name: LAB_MGMT_SUBNET
  value: 172.20.30.0/24
  description: Management subnet containerlab assigns to the FRR lab routers.
notification_destinations:
- name: Meridian NOC Email
  type: email
  enabled: true
  config_json:
    to:
    - noc@meridian.example
    from: hegemony@meridian.example
    smtp_host_ref: '{{ env(''HEGEMONY_DEMO_SMTP_HOST'', ''demo-notification-smtp'') }}'
    smtp_port_ref: '{{ env(''HEGEMONY_DEMO_SMTP_PORT'', ''1025'') }}'
    smtp_use_tls_ref: '{{ env(''HEGEMONY_DEMO_SMTP_USE_TLS'', ''false'') }}'
    smtp_use_starttls_ref: '{{ env(''HEGEMONY_DEMO_SMTP_USE_STARTTLS'', ''false'') }}'
- name: Meridian Security Email
  type: email
  enabled: true
  config_json:
    to:
    - security@meridian.example
    from: hegemony@meridian.example
    smtp_host_ref: '{{ env(''HEGEMONY_DEMO_SMTP_HOST'', ''demo-notification-smtp'') }}'
    smtp_port_ref: '{{ env(''HEGEMONY_DEMO_SMTP_PORT'', ''1025'') }}'
    smtp_use_tls_ref: '{{ env(''HEGEMONY_DEMO_SMTP_USE_TLS'', ''false'') }}'
    smtp_use_starttls_ref: '{{ env(''HEGEMONY_DEMO_SMTP_USE_STARTTLS'', ''false'') }}'
- name: Meridian Discord
  type: discord
  enabled: true
  config_json:
    token: '{{ secret(''vault://orgs/default/secrets/meridian/integrations/notify/discord_token'') }}'
    webhook_id: '123456789012345678'
- name: Meridian Slack
  type: slack
  enabled: true
  config_json:
    token: '{{ secret(''vault://orgs/default/secrets/meridian/integrations/notify/slack_token'') }}'
    botname: Meridian
- name: Meridian Telegram
  type: telegram
  enabled: true
  config_json:
    token: '{{ secret(''vault://orgs/default/secrets/meridian/integrations/notify/telegram_token'') }}'
    chats: '123456789'
- name: Meridian Teams
  type: teams_power_automate
  enabled: true
  config_json:
    url: '{{ secret(''vault://orgs/default/secrets/meridian/integrations/notify/teams_url'') }}'
- name: Meridian Webex
  type: webex_incoming_webhook
  enabled: true
  config_json:
    webhook_token: '{{ secret(''vault://orgs/default/secrets/meridian/integrations/notify/webex_token'') }}'
- name: Meridian Ntfy
  type: shoutrrr
  enabled: true
  config_json:
    url_secret: '{{ secret(''vault://orgs/default/secrets/meridian/integrations/notify/ntfy_url'') }}'
    title: Meridian Networks Demo
- name: 'Meridian Webhook: Signed HMAC'
  type: outgoing_webhook
  enabled: true
  config_json:
    url: https://meridian-notify.invalid/webhooks/signed
    method: POST
    headers:
      X-Meridian-Receiver: synthetic-signed
    timeout_seconds: 5
    retry_count: 0
    verify_tls: true
    auth_type: none
    signing:
      algorithm: hmac-sha256
      secret_ref: '{{ secret(''vault://orgs/default/secrets/meridian/integrations/webhook/signing_secret'') }}'
      signature_header: X-Meridian-Signature
      timestamp_header: X-Meridian-Timestamp
      signed_content: timestamp_dot_body
      prefix: sha256=
schedules:
- name: Nightly config backup (demo)
  flow: 'Ops: Backup lab configs to Git'
  schedule_type: recurring
