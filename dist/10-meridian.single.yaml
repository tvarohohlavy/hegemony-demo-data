- name: 'Net: End-to-end reachability test'
  description: Log into the selected Linux endpoint hosts over SSH and ping the chosen lab destinations across the routed
    fabric — a true end-to-end test from host LAN to host LAN through multi-area OSPF. Demonstrates the remote shell (exec-channel)
    paradigm on plain Linux devices.
  definition:
    graph:
      nodes:
      - id: start
        name: Start
        type: start
        position_x: 0
        position_y: 140
      - id: reachable
        name: Reachability probe (TCP/22)
        type: step
        kind: CHECK
        phase: PREPARE
        handler: probe.connectivity
        position_x: 240
        position_y: 140
        target_selectors:
        - type: role
          role: probe_sources
        params:
          check_type: tcp_connect
          port: 22
          timeout_sec: 10
          attempts: 2
        policy:
          timeout_sec: 60
          retries: 0
          on_failure: FAIL_RUN
          evidence_required: false
      - id: host_facts
        name: Collect host facts
        type: step
        kind: ACTION
        phase: PREPARE
        handler: shell.execute
        position_x: 660
        position_y: 140
        target_selectors:
        - type: role
          role: probe_sources
        params:
          shell: default
          fail_fast: true
          command_timeout_sec: 30
          commands:
          - uname -a
          - ip -brief address
          - ip route show
        policy:
          timeout_sec: 90
          retries: 0
          on_failure: FAIL_RUN
          evidence_required: false
      - id: ping_targets
        name: Ping selected destinations
        type: step
        kind: ACTION
        phase: VERIFY
        handler: shell.execute
        position_x: 1080
        position_y: 140
        target_selectors:
        - type: role
          role: probe_sources
        params:
          shell: sh
          fail_fast: true
          command_timeout_sec: 120
          commands:
          - FAIL=0; for t in {{ inputs.ping_targets | join(" ") }}; do echo "--- ping $t ---"; ping -c 3 -W 2 "$t" || FAIL=1;
            done; exit $FAIL
        policy:
          timeout_sec: 180
          retries: 0
          on_failure: FAIL_RUN
          evidence_required: false
      - id: done
        name: All destinations reachable
        type: terminal
        terminal_status: success
        position_x: 1500
        position_y: 60
      - id: failed
        name: Reachability failed
        type: terminal
        terminal_status: failure
        position_x: 1500
        position_y: 280
      edges:
      - id: e_start_reachable
        source: start:start
        target: reachable
      - id: e_reachable_facts
        source: reachable:success
        target: host_facts
      - id: e_reachable_failed
        source: reachable:failure
        target: failed
      - id: e_facts_ping
        source: host_facts:success
        target: ping_targets
      - id: e_facts_failed
        source: host_facts:failure
        target: failed
      - id: e_ping_done
        source: ping_targets:success
        target: done
      - id: e_ping_failed
        source: ping_targets:failure
        target: failed
    interface_graph:
      nodes:
      - id: sec_sources
        kind: section
        position_x: 80
        position_y: 80
        width: 480
        height: 200
        data:
          label: Probe sources
          description: Linux endpoint hosts to run the test from.
          runtime_layout: card
          collapsible: false
      - id: f_sources
        kind: field
        parent_id: sec_sources
        position_x: 40
        position_y: 60
        data:
          label: Endpoint hosts
          field_id: sources
          field_type: inventory.device
          required: true
          description: Lab endpoint hosts (role server) to probe from — preselected.
          default_value:
          - dc1-srv-01
          - dc2-srv-01
          - br1-srv-01
          - br2-srv-01
          config:
            role: probe_sources
            multiple: true
            option_source:
              kind: inventory.devices
      - id: sec_destinations
        kind: section
        position_x: 620
        position_y: 80
        width: 520
        height: 220
        data:
          label: Destinations
          runtime_layout: card
          collapsible: false
      - id: f_ping_targets
        kind: field
        parent_id: sec_destinations
        position_x: 40
        position_y: 60
        data:
          label: Ping destinations
          field_id: ping_targets
          field_type: core.multi_enum
          required: true
          default_value:
          - 10.101.1.10
          - 10.104.1.10
          description: Lab addresses each source host must reach.
          config:
            multiple: true
            option_source:
              kind: core.static
              static_options:
              - value: 10.101.1.10
                label: dc1-srv-01 (Lab DC1 endpoint LAN)
              - value: 10.104.1.10
                label: dc2-srv-01 (Lab DC2 endpoint LAN)
              - value: 10.102.1.10
                label: br1-srv-01 (Lab Branch 1 endpoint LAN)
              - value: 10.103.1.10
                label: br2-srv-01 (Lab Branch 2 endpoint LAN)
              - value: 10.255.255.1
                label: dc1-core-01 loopback (backbone)
              - value: 10.255.255.9
                label: dc2-core-01 loopback (backbone)
      edges: []
- name: 'Net: Wait for OSPF convergence'
  description: 'Retry-until-healthy: collect OSPF neighbor state from the selected routers in a loop until every adjacency
    is Full (or give up after 6 attempts). Run-scoped variables track the attempt count and verdict; a branch after the loop
    reports whether the fabric was converged on the first check or needed retries.'
  definition:
    graph:
      nodes:
      - id: start
        name: Start
        type: start
        position_x: 0
        position_y: 300
      - id: sv_init
        name: Init counters
        type: set_vars
        position_x: 200
        position_y: 300
        assignments:
        - name: attempts
          expr: '0'
        - name: converged
          expr: 'false'
      - id: conv_loop
        name: Until converged
        type: loop
        loop_mode: until
        condition: run.vars.converged | default(false)
        max_iterations: 6
        position_x: 620
        position_y: 80
        width: 1260
        height: 460
      - id: collect_state
        name: Collect OSPF neighbors
        type: step
        kind: CHECK
        phase: VERIFY
        handler: netcli.collect_evidence
        scope_id: conv_loop
        position_x: 60
        position_y: 100
        target_selectors:
        - type: role
          role: converge_targets
        params:
          commands:
          - show ip ospf neighbor
        policy:
          timeout_sec: 120
          retries: 0
          on_failure: CONTINUE
          evidence_required: true
      - id: assert_full
        name: All adjacencies Full?
        type: step
        kind: CHECK
        phase: VERIFY
        handler: evidence.assert
        scope_id: conv_loop
        position_x: 440
        position_y: 100
        params:
          artifact_step_id: collect_state
          target_role: converge_targets
          command: show ip ospf neighbor
          operator: contains
          expected: Full
          message: At least one router still has a non-Full OSPF neighbor.
        policy:
          timeout_sec: 60
          retries: 0
          on_failure: CONTINUE
          evidence_required: false
      - id: sv_ok
        name: Mark converged
        type: set_vars
        scope_id: conv_loop
        position_x: 820
        position_y: 60
        assignments:
        - name: attempts
          expr: (run.vars.attempts | default(0) | int) + 1
        - name: converged
          expr: 'true'
      - id: sv_retry
        name: Mark not converged
        type: set_vars
        scope_id: conv_loop
        position_x: 820
        position_y: 260
        assignments:
        - name: attempts
          expr: (run.vars.attempts | default(0) | int) + 1
        - name: converged
          expr: 'false'
      - id: conv_loop_end
        name: Loop End
        type: loop_end
        loop_ref: conv_loop
        scope_id: conv_loop
        position_x: 1182
        position_y: 426
      - id: verdict
        name: How fast did we converge?
        type: branch
        branch_mode: rules
        position_x: 2000
        position_y: 280
        cases:
        - id: c_first
          label: Converged on first check
          when: run.vars.attempts | int <= 1
      - id: done_first
        name: Healthy (first check)
        type: terminal
        terminal_status: success
        position_x: 2360
        position_y: 180
      - id: done_retry
        name: Converged after retries
        type: terminal
        terminal_status: success
        position_x: 2360
        position_y: 320
      - id: not_converged
        name: Did not converge
        type: terminal
        terminal_status: failure
        position_x: 2000
        position_y: 560
      edges:
      - id: e_start_init
        source: start:start
        target: sv_init
      - id: e_init_loop
        source: sv_init:success
        target: conv_loop
      - id: e_loop_collect
        source: conv_loop:iterate
        target: collect_state
      - id: e_collect_assert
        source: collect_state:success
        target: assert_full
      - id: e_collect_retry
        source: collect_state:failure
        target: sv_retry
      - id: e_assert_ok
        source: assert_full:success
        target: sv_ok
      - id: e_assert_retry
        source: assert_full:failure
        target: sv_retry
      - id: e_ok_end
        source: sv_ok:success
        target: conv_loop_end
      - id: e_retry_end
        source: sv_retry:success
        target: conv_loop_end
      - id: e_loop_verdict
        source: conv_loop:done
        target: verdict
      - id: e_loop_giveup
        source: conv_loop:max_iterations
        target: not_converged
      - id: e_verdict_first
        source: verdict:case:c_first
        target: done_first
      - id: e_verdict_retry
        source: verdict:else
        target: done_retry
    interface_graph:
      nodes:
      - id: sec_targets
        kind: section
        position_x: 80
        position_y: 80
        width: 480
        height: 180
        data:
          label: Target routers
          runtime_layout: card
          collapsible: false
      - id: f_targets
        kind: field
        parent_id: sec_targets
        position_x: 40
        position_y: 60
        data:
          label: Routers
          field_id: targets
          field_type: inventory.device
          required: true
          description: Routers whose OSPF adjacencies must all be Full — the core fabric, preselected.
          default_value:
          - dc1-core-01
          - dc1-core-02
          - dc2-core-01
          - dc2-core-02
          config:
            role: converge_targets
            multiple: true
            option_source:
              kind: inventory.devices
      edges: []
- name: 'Net: Per-prefix route audit'
  description: For each prefix chosen on the launch form, run "show ip route <prefix>" on the selected routers, record the
    output as evidence, and assert the route is actually present — one loop iteration (and one StepRun) per prefix, with audited/missing
    counts kept in run.vars. The loop collects each audited prefix and a branch after the loop reports success only when nothing
    was missing. Demonstrates the for-each loop, loop.item templating, collect, and a post-loop verdict branch.
  definition:
    graph:
      nodes:
      - id: start
        name: Start
        type: start
        position_x: 0
        position_y: 280
      - id: sv_zero
        name: Reset audit counters
        type: set_vars
        position_x: 200
        position_y: 280
        assignments:
        - name: audited
          expr: '0'
        - name: missing
          expr: '0'
      - id: prefix_loop
        name: For each prefix
        type: loop
        loop_mode: for_each
        items_expr: inputs.check_prefixes
        collect: loop.item
        position_x: 620
        position_y: 60
        width: 1260
        height: 460
      - id: check_route
        name: Per-prefix route lookup
        type: step
        kind: CHECK
        phase: VERIFY
        handler: netcli.collect_evidence
        scope_id: prefix_loop
        position_x: 60
        position_y: 100
        target_selectors:
        - type: role
          role: audit_targets
        params:
          commands:
          - show ip route {{ loop.item }}
        policy:
          timeout_sec: 120
          retries: 0
          on_failure: CONTINUE
          evidence_required: true
      - id: route_ok
        name: Route present?
        type: step
        kind: CHECK
        phase: VERIFY
        handler: evidence.assert
        scope_id: prefix_loop
        position_x: 440
        position_y: 100
        params:
          artifact_step_id: check_route
          target_role: audit_targets
          command: show ip route {{ loop.item }}
          operator: contains
          expected: Routing entry for
          message: A router has no route for {{ loop.item }}.
        policy:
          timeout_sec: 60
          retries: 0
          on_failure: CONTINUE
          evidence_required: false
      - id: sv_found
        name: Count audited
        type: set_vars
        scope_id: prefix_loop
        position_x: 820
        position_y: 60
        assignments:
        - name: audited
          expr: (run.vars.audited | default(0) | int) + 1
      - id: sv_gap
        name: Count missing
        type: set_vars
        scope_id: prefix_loop
        position_x: 820
        position_y: 260
        assignments:
        - name: audited
          expr: (run.vars.audited | default(0) | int) + 1
        - name: missing
          expr: (run.vars.missing | default(0) | int) + 1
      - id: prefix_loop_end
        name: Loop End
        type: loop_end
        loop_ref: prefix_loop
        scope_id: prefix_loop
        position_x: 1182
        position_y: 426
      - id: audit_verdict
        name: Any prefix missing?
        type: branch
        branch_mode: rules
        position_x: 2000
        position_y: 260
        cases:
        - id: c_clean
          label: All prefixes present
          when: (run.vars.missing | default(0) | int) == 0
      - id: audit_done
        name: All prefixes present
        type: terminal
        terminal_status: success
        position_x: 2360
        position_y: 160
      - id: audit_gaps
        name: Prefixes missing
        type: terminal
        terminal_status: failure
        position_x: 2360
        position_y: 340
      edges:
      - id: e_start_zero
        source: start:start
        target: sv_zero
      - id: e_zero_loop
        source: sv_zero:success
        target: prefix_loop
      - id: e_loop_check
        source: prefix_loop:iterate
        target: check_route
      - id: e_check_assert
        source: check_route:success
        target: route_ok
      - id: e_check_gap
        source: check_route:failure
        target: sv_gap
      - id: e_assert_found
        source: route_ok:success
        target: sv_found
      - id: e_assert_gap
        source: route_ok:failure
        target: sv_gap
      - id: e_found_end
        source: sv_found:success
        target: prefix_loop_end
      - id: e_gap_end
        source: sv_gap:success
        target: prefix_loop_end
      - id: e_loop_verdict
        source: prefix_loop:done
        target: audit_verdict
      - id: e_verdict_clean
        source: audit_verdict:case:c_clean
        target: audit_done
      - id: e_verdict_gaps
        source: audit_verdict:else
        target: audit_gaps
    interface_graph:
      nodes:
      - id: sec_targets
        kind: section
        position_x: 80
        position_y: 80
        width: 480
        height: 180
        data:
          label: Target routers
          runtime_layout: card
          collapsible: false
      - id: f_targets
        kind: field
        parent_id: sec_targets
        position_x: 40
        position_y: 60
        data:
          label: Routers
          field_id: targets
          field_type: inventory.device
          required: true
          description: Routers to audit the prefixes on — core routers preselected.
          default_value:
          - dc1-core-01
          - dc2-core-01
          config:
            role: audit_targets
            multiple: true
            option_source:
              kind: inventory.devices
      - id: sec_prefixes
        kind: section
        position_x: 620
        position_y: 80
        width: 520
        height: 220
        data:
          label: Prefixes
          runtime_layout: card
          collapsible: false
      - id: f_prefixes
        kind: field
        parent_id: sec_prefixes
        position_x: 40
        position_y: 60
        data:
          label: Prefixes to audit
          field_id: check_prefixes
          field_type: core.multi_enum
          required: true
          default_value:
          - 10.101.1.0/24
          - 10.104.1.0/24
          - 10.255.255.1/32
          description: One loop iteration audits each selected prefix.
          config:
            multiple: true
            option_source:
              kind: core.static
              static_options:
              - value: 10.101.1.0/24
                label: Lab DC1 endpoint LAN
              - value: 10.104.1.0/24
                label: Lab DC2 endpoint LAN
              - value: 10.102.1.0/24
                label: Lab Branch 1 endpoint LAN
              - value: 10.103.1.0/24
                label: Lab Branch 2 endpoint LAN
              - value: 10.255.255.1/32
                label: dc1-core-01 loopback
              - value: 10.255.255.9/32
                label: dc2-core-01 loopback
      edges: []
- name: 'IaC: Ansible server baseline rollout'
  description: Roll the golden server baseline across the lab's Linux hosts one host at a time with Ansible (SSH + become,
    standards resolved from org variables). A failing host halts the rollout immediately via the loop's break edge — run variables
    record the host being processed and how many completed — and a report step summarizes the hosts the loop collected.
  definition:
    graph:
      nodes:
      - id: start
        name: Start
        type: start
        position_x: 0
        position_y: 240
      - id: sv_init
        name: Init rollout state
        type: set_vars
        position_x: 200
        position_y: 240
        assignments:
        - name: rolled_out
          expr: '0'
        - name: current_host
          expr: ''''''
      - id: rollout
        name: For each server
        type: loop
        loop_mode: for_each
        items_expr: inputs.baseline_hosts
        max_iterations: 16
        collect: loop.item
        position_x: 600
        position_y: 80
        width: 1280
        height: 340
      - id: sv_mark
        name: Mark current host
        type: set_vars
        scope_id: rollout
        position_x: 60
        position_y: 100
        assignments:
        - name: current_host
          expr: loop.item
      - id: apply_baseline
        name: Apply server baseline
        type: step
        kind: EXECUTE
        phase: IMPLEMENTATION
        handler: container.run
        scope_id: rollout
        position_x: 460
        position_y: 100
        mounted_files:
        - hosts.ini
        - baseline.yml
        - rolling.sh
        params:
          image: alpine:3.22
          working_dir: /workspace
          network_mode: host
          timeout_seconds: 300
          command:
          - sh /attachments/rolling.sh
          env:
            TARGET_HOST: '{{ loop.item }}'
            LAB_USER: '{{ secret(''vault://orgs/default/secrets/meridian/lab/ssh/username'') }}'
            LAB_PASSWORD: '{{ secret(''vault://orgs/default/secrets/meridian/lab/ssh/password'') }}'
            TENANT_NAME: '{{ vars.TENANT_NAME }}'
            NTP_PRIMARY: '{{ vars.NTP_PRIMARY }}'
            DNS_PRIMARY: '{{ vars.DNS_PRIMARY }}'
            SYSLOG_PRIMARY: '{{ vars.SYSLOG_PRIMARY }}'
        policy:
          timeout_sec: 330
          retries: 0
          on_failure: CONTINUE
          evidence_required: false
      - id: sv_ok
        name: Count host done
        type: set_vars
        scope_id: rollout
        position_x: 840
        position_y: 100
        assignments:
        - name: rolled_out
          expr: (run.vars.rolled_out | default(0) | int) + 1
      - id: rollout_end
        name: Loop End
        type: loop_end
        loop_ref: rollout
        scope_id: rollout
        position_x: 1202
        position_y: 306
      - id: report
        name: Rollout report
        type: step
        kind: EXECUTE
        phase: VERIFY
        handler: container.run
        position_x: 2000
        position_y: 200
        params:
          image: alpine:3.22
          working_dir: /workspace
          timeout_seconds: 60
          command:
          - "mkdir -p /artifacts/new\n{\n  echo \"Ansible server baseline rollout\"\n  echo \"Hosts baselined (${COUNT}):\
            \ ${BASELINED}\"\n} | tee /artifacts/new/rollout-report.txt\n"
          env:
            BASELINED: '{{ steps.rollout.output.results | join('', '') }}'
            COUNT: '{{ run.vars.rolled_out | default(0) }}'
        policy:
          timeout_sec: 90
          retries: 0
          on_failure: CONTINUE
          evidence_required: false
      - id: ok
        name: Rollout complete
        type: terminal
        terminal_status: success
        position_x: 2420
        position_y: 210
      - id: halted
        name: Rollout halted
        type: terminal
        terminal_status: failure
        position_x: 2000
        position_y: 480
      edges:
      - id: e_start_init
        source: start:start
        target: sv_init
      - id: e_init_rollout
        source: sv_init:success
        target: rollout
      - id: e_rollout_mark
        source: rollout:iterate
        target: sv_mark
      - id: e_mark_apply
        source: sv_mark:success
        target: apply_baseline
      - id: e_apply_ok
        source: apply_baseline:success
        target: sv_ok
      - id: e_ok_end
        source: sv_ok:success
        target: rollout_end
      - id: e_apply_halt
        source: apply_baseline:failure
        target: halted
      - id: e_rollout_report
        source: rollout:done
        target: report
      - id: e_rollout_max
        source: rollout:max_iterations
        target: halted
      - id: e_report_ok
        source: report:success
        target: ok
      - id: e_report_failed
        source: report:failure
        target: halted
    interface_graph:
      nodes:
      - id: sec_targets
        kind: section
        position_x: 80
        position_y: 80
        width: 520
        height: 200
        data:
          label: Servers
          runtime_layout: card
          collapsible: false
      - id: f_hosts
        kind: field
        parent_id: sec_targets
        position_x: 40
        position_y: 60
        data:
          label: Servers to baseline
          field_id: baseline_hosts
          field_type: inventory.device
          required: true
          description: Lab Linux servers, baselined strictly in this order — the rollout stops at the first failure.
          default_value:
          - dc1-srv-01
          - dc2-srv-01
          - br1-srv-01
          - br2-srv-01
          config:
            role: baseline_targets
            multiple: true
            option_source:
              kind: inventory.devices
      edges: []
- name: 'IaC: Terraform router service'
  description: 'Declare a routed service loopback in Terraform (offline, builtin resources, state in the run''s shared workspace),
    then switch on the requested action: plan-only stops after the reviewable plan artifact, apply is approval-gated and followed
    by a -detailed-exitcode convergence check before netcli pushes the declared config to the routers and asserts the post-change
    evidence.'
  definition:
    graph:
      nodes:
      - id: start
        name: Start
        type: start
        position_x: 0
        position_y: 280
      - id: plan
        name: terraform plan
        type: step
        kind: CHECK
        phase: PREPARE
        handler: container.run
        execution_affinity: shared
        position_x: 200
        position_y: 280
        mounted_files:
        - service.tf
        - plan.sh
        params:
          image: hashicorp/terraform:1.9
          entrypoint: /bin/sh
          working_dir: /workspace
          timeout_seconds: 240
          command:
          - sh /attachments/plan.sh
          env:
            TF_VAR_service_name: '{{ inputs.service_name }}'
            TF_VAR_service_prefix: '{{ inputs.service_prefix }}'
            TF_VAR_routers: '{{ inputs.tf_targets | tojson }}'
        policy:
          timeout_sec: 300
          retries: 0
          on_failure: CONTINUE
          evidence_required: false
      - id: route
        name: Requested action?
        type: branch
        branch_mode: value
        value_expr: inputs.tf_action
        position_x: 620
        position_y: 270
        cases:
        - id: c_plan
          label: Plan only
          equals: plan
        - id: c_apply
          label: Plan and apply
          equals: apply
      - id: plan_done
        name: Plan reviewed
        type: terminal
        terminal_status: success
        position_x: 970
        position_y: 80
      - id: gate
        name: Approve apply
        type: approval
        phase: IMPLEMENTATION
        position_x: 970
        position_y: 270
        params:
          title: Approve Terraform apply
          message: Review the terraform-plan.txt artifact on the plan step, then approve to apply the saved plan and push
            the declared service loopback to the selected routers.
          timeout_seconds: 3600
        policy:
          timeout_sec: 3600
          retries: 0
          on_failure: FAIL_RUN
          evidence_required: false
      - id: apply
        name: terraform apply
        type: step
        kind: ACTION
        phase: IMPLEMENTATION
        handler: container.run
        execution_affinity: shared
        position_x: 1440
        position_y: 270
        mounted_files:
        - apply.sh
        params:
          image: hashicorp/terraform:1.9
          entrypoint: /bin/sh
          working_dir: /workspace
          timeout_seconds: 240
          command:
          - sh /attachments/apply.sh
        policy:
          timeout_sec: 300
          retries: 0
          on_failure: CONTINUE
          evidence_required: false
      - id: tf_verify
        name: Convergence check
        type: step
        kind: CHECK
        phase: VERIFY
        handler: container.run
        execution_affinity: shared
        position_x: 1860
        position_y: 270
        mounted_files:
        - verify.sh
        params:
          image: hashicorp/terraform:1.9
          entrypoint: /bin/sh
          working_dir: /workspace
          timeout_seconds: 240
          command:
          - sh /attachments/verify.sh
          env:
            TF_VAR_service_name: '{{ inputs.service_name }}'
            TF_VAR_service_prefix: '{{ inputs.service_prefix }}'
            TF_VAR_routers: '{{ inputs.tf_targets | tojson }}'
        policy:
          timeout_sec: 300
          retries: 0
          on_failure: CONTINUE
          evidence_required: false
      - id: push
        name: Push config to routers
        type: step
        kind: ACTION
        phase: IMPLEMENTATION
        handler: netcli.execute
        position_x: 2280
        position_y: 270
        target_selectors:
        - type: role
          role: tf_targets
        params:
          commands:
          - configure terminal
          - interface lo
          - description svc {{ inputs.service_name }} managed-by-terraform
          - ip address {{ inputs.service_prefix }}/32
          - end
        policy:
          timeout_sec: 120
          retries: 0
          on_failure: CONTINUE
          evidence_required: false
      - id: postcheck
        name: Post-change evidence
        type: step
        kind: CHECK
        phase: VERIFY
        handler: netcli.collect_evidence
        position_x: 2700
        position_y: 270
        target_selectors:
        - type: role
          role: tf_targets
        params:
          commands:
          - show running-config
        policy:
          timeout_sec: 120
          retries: 0
          on_failure: CONTINUE
          evidence_required: true
      - id: confirm
        name: Declared config present?
        type: step
        kind: CHECK
        phase: VERIFY
        handler: evidence.assert
        position_x: 3120
        position_y: 270
        params:
          artifact_step_id: postcheck
          target_role: tf_targets
          command: show running-config
          operator: contains
          expected: svc {{ inputs.service_name }} managed-by-terraform
          message: A target router does not carry the declared service loopback.
        policy:
          timeout_sec: 60
          retries: 0
          on_failure: CONTINUE
          evidence_required: false
      - id: done
        name: Service deployed
        type: terminal
        terminal_status: success
        position_x: 3540
        position_y: 180
      - id: failed
        name: Deployment failed
        type: terminal
        terminal_status: failure
        position_x: 1700
        position_y: 600
      edges:
      - id: e_start_plan
        source: start:start
        target: plan
      - id: e_plan_route
        source: plan:success
        target: route
      - id: e_plan_failed
        source: plan:failure
        target: failed
      - id: e_route_plan_only
        source: route:case:c_plan
        target: plan_done
      - id: e_route_apply
        source: route:case:c_apply
        target: gate
      - id: e_route_else
        source: route:else
        target: failed
      - id: e_route_error
        source: route:error
        target: failed
      - id: e_gate_apply
        source: gate:approved
        target: apply
      - id: e_gate_rejected
        source: gate:rejected
        target: failed
      - id: e_gate_expired
        source: gate:expired
        target: failed
      - id: e_apply_verify
        source: apply:success
        target: tf_verify
      - id: e_apply_failed
        source: apply:failure
        target: failed
      - id: e_verify_push
        source: tf_verify:success
        target: push
      - id: e_verify_failed
        source: tf_verify:failure
        target: failed
      - id: e_push_postcheck
        source: push:success
        target: postcheck
      - id: e_push_failed
        source: push:failure
        target: failed
      - id: e_postcheck_confirm
        source: postcheck:success
        target: confirm
      - id: e_postcheck_failed
        source: postcheck:failure
        target: failed
      - id: e_confirm_done
        source: confirm:success
        target: done
      - id: e_confirm_failed
        source: confirm:failure
        target: failed
    interface_graph:
      nodes:
      - id: sec_action
        kind: section
        position_x: 80
        position_y: 80
        width: 440
        height: 180
        data:
          label: Action
          runtime_layout: card
          collapsible: false
      - id: f_action
        kind: field
        parent_id: sec_action
        position_x: 40
        position_y: 60
        data:
          label: Terraform action
          field_id: tf_action
          field_type: core.enum
          required: true
          default_value: plan
          description: Plan-only stops after the reviewable plan artifact.
          config:
            option_source:
              kind: core.static
              static_options:
              - value: plan
                label: Plan only
              - value: apply
                label: Plan and apply (approval-gated)
      - id: sec_service
        kind: section
        position_x: 560
        position_y: 80
        width: 520
        height: 220
        data:
          label: Service
          runtime_layout: card
          collapsible: false
      - id: f_service_name
        kind: field
        parent_id: sec_service
        position_x: 40
        position_y: 60
        data:
          label: Service name
          field_id: service_name
          field_type: core.text
          required: true
          default_value: telemetry
          description: Short identifier stamped into the interface description.
          config:
            validations:
              combinator: AND
              children:
              - id: v_name
                op: regex
                operand:
                  kind: value
                  value: ^[a-z][a-z0-9-]{1,20}$
      - id: f_service_prefix
        kind: field
        parent_id: sec_service
        position_x: 300
        position_y: 60
        data:
          label: Service address
          field_id: service_prefix
          field_type: core.text
          required: true
          default_value: 10.210.10.1
          description: Host address for the service loopback (pushed as a /32).
          config:
            validations:
              combinator: AND
              children:
              - id: v_prefix
                op: regex
                operand:
                  kind: value
                  value: ^10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$
      - id: sec_targets
        kind: section
        position_x: 1140
        position_y: 80
        width: 480
        height: 180
        data:
          label: Target routers
          runtime_layout: card
          collapsible: false
      - id: f_targets
        kind: field
        parent_id: sec_targets
        position_x: 40
        position_y: 60
        data:
          label: Routers
          field_id: tf_targets
          field_type: inventory.device
          required: true
          description: Routers that must carry the service loopback.
          default_value:
          - dc1-core-01
          - dc2-core-01
          config:
            role: tf_targets
            multiple: true
            option_source:
              kind: inventory.devices
      edges: []
- name: 'IaC: Ansible router drift remediation'
  description: Audit the selected FRR routers for the golden loopback description and, while any router drifts, remediate
    with an Ansible raw/vtysh playbook — re-auditing each pass until the fleet converges or the loop's iteration cap routes
    to a manual-intervention terminal. Run variables count the passes and record the verdict.
  definition:
    graph:
      nodes:
      - id: start
        name: Start
        type: start
        position_x: 0
        position_y: 280
      - id: sv_init
        name: Init audit state
        type: set_vars
        position_x: 200
        position_y: 280
        assignments:
        - name: compliant
          expr: 'false'
        - name: passes
          expr: '0'
      - id: fix_loop
        name: Until compliant
        type: loop
        loop_mode: while
        condition: not (run.vars.compliant | default(false))
        max_iterations: 3
        position_x: 620
        position_y: 60
        width: 1640
        height: 460
      - id: audit
        name: Audit running config
        type: step
        kind: CHECK
        phase: VERIFY
        handler: netcli.collect_evidence
        scope_id: fix_loop
        position_x: 60
        position_y: 100
        target_selectors:
        - type: role
          role: drift_targets
        params:
          commands:
          - show running-config
        policy:
          timeout_sec: 120
          retries: 0
          on_failure: CONTINUE
          evidence_required: true
      - id: check
        name: Golden description present?
        type: step
        kind: CHECK
        phase: VERIFY
        handler: evidence.assert
        scope_id: fix_loop
        position_x: 440
        position_y: 100
        params:
          artifact_step_id: audit
          target_role: drift_targets
          command: show running-config
          operator: contains
          expected: managed by Meridian NetOps
          message: At least one router lacks the golden loopback description.
        policy:
          timeout_sec: 60
          retries: 0
          on_failure: CONTINUE
          evidence_required: false
      - id: sv_done
        name: Mark compliant
        type: set_vars
        scope_id: fix_loop
        position_x: 820
        position_y: 60
        assignments:
        - name: compliant
          expr: 'true'
        - name: passes
          expr: (run.vars.passes | default(0) | int) + 1
      - id: remediate
        name: Ansible remediation
        type: step
        kind: EXECUTE
        phase: IMPLEMENTATION
        handler: container.run
        scope_id: fix_loop
        position_x: 820
        position_y: 260
        mounted_files:
        - routers.ini
        - remediate.yml
        - remediate.sh
        params:
          image: alpine:3.22
          working_dir: /workspace
          network_mode: host
          timeout_seconds: 300
          command:
          - sh /attachments/remediate.sh
          env:
            LIMIT_HOSTS: '{{ inputs.drift_targets | join('','') }}'
            LAB_USER: '{{ secret(''vault://orgs/default/secrets/meridian/lab/ssh/username'') }}'
            LAB_PASSWORD: '{{ secret(''vault://orgs/default/secrets/meridian/lab/ssh/password'') }}'
        policy:
          timeout_sec: 330
          retries: 0
          on_failure: CONTINUE
          evidence_required: false
      - id: sv_retry
        name: Mark drifting
        type: set_vars
        scope_id: fix_loop
        position_x: 1200
        position_y: 260
        assignments:
        - name: compliant
          expr: 'false'
        - name: passes
          expr: (run.vars.passes | default(0) | int) + 1
      - id: fix_end
        name: Loop End
        type: loop_end
        loop_ref: fix_loop
        scope_id: fix_loop
        position_x: 1562
        position_y: 426
      - id: converged
        name: Fleet compliant
        type: terminal
        terminal_status: success
        position_x: 2380
        position_y: 240
      - id: manual
        name: Manual intervention required
        type: terminal
        terminal_status: failure
        position_x: 2380
        position_y: 440
      edges:
      - id: e_start_init
        source: start:start
        target: sv_init
      - id: e_init_loop
        source: sv_init:success
        target: fix_loop
      - id: e_loop_audit
        source: fix_loop:iterate
        target: audit
      - id: e_audit_check
        source: audit:success
        target: check
      - id: e_audit_retry
        source: audit:failure
        target: sv_retry
      - id: e_check_done
        source: check:success
        target: sv_done
      - id: e_check_remediate
        source: check:failure
        target: remediate
      - id: e_remediate_retry
        source: remediate:success
        target: sv_retry
      - id: e_remediate_failed
        source: remediate:failure
        target: sv_retry
      - id: e_done_end
        source: sv_done:success
        target: fix_end
      - id: e_retry_end
        source: sv_retry:success
        target: fix_end
      - id: e_loop_converged
        source: fix_loop:done
        target: converged
      - id: e_loop_manual
        source: fix_loop:max_iterations
        target: manual
    interface_graph:
      nodes:
      - id: sec_targets
        kind: section
        position_x: 80
        position_y: 80
        width: 520
        height: 200
        data:
          label: Routers
          runtime_layout: card
          collapsible: false
      - id: f_targets
        kind: field
        parent_id: sec_targets
        position_x: 40
        position_y: 60
        data:
          label: Routers to audit
          field_id: drift_targets
          field_type: inventory.device
          required: true
          description: FRR routers audited for the golden loopback description — the core fabric, preselected. Remediation
            is limited to this selection.
          default_value:
          - dc1-core-01
          - dc1-core-02
          - dc2-core-01
          - dc2-core-02
          config:
            role: drift_targets
            multiple: true
            option_source:
              kind: inventory.devices
      edges: []
flow_attachments:
- flow: 'Lab: Provision and tear down demo datacenter'
  filename: Dockerfile
  content: "# SPDX-FileCopyrightText: 2025-2026 Jakub Trávník <jakub.travnik@gmail.com>\n# SPDX-License-Identifier: AGPL-3.0-or-later\n\
    #\n# FRRouting + OpenSSH lab node. The stock FRR image has no SSH server, so\n# Hegemony's network CLI step handlers (netmiko\
    \ over the device access config)\n# cannot reach it. This image adds sshd and a non-root \"clab\" login whose login\n\
    # SHELL IS vtysh: an SSH session drops straight into FRR's Cisco-IOS-style CLI,\n# so Hegemony's netcli handlers (platform\
    \ ios-xe -> netmiko cisco_ios) drive it\n# exactly like a real switch. clab is a member of the frr/frrvty groups so vtysh\n\
    # can reach the daemon sockets.\n#\n# Built locally by \"Lab: Bootstrap demo datacenter\" and referenced from\n# topology.clab.yml\
    \ as image \"meridian/frr-lab:latest\".\nFROM quay.io/frrouting/frr:9.1.0\n\n# The login password is injected at build\
    \ time from the meridian-lab-ssh vault\n# secret (see the Bootstrap flow's build step), so the secret stays the single\n\
    # source of truth. The default only covers standalone `docker build` use.\nARG LAB_PASSWORD=demo-lab-password\n\n# openssh\
    \ for the SSH channel; shadow for chpasswd.\nRUN apk add --no-cache openssh openssh-server shadow \\\n    && ssh-keygen\
    \ -A \\\n    && sed -i 's/^#\\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config \\\n    && sed\
    \ -i 's/^#\\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config \\\n    && adduser -D -s /usr/bin/vtysh clab\
    \ \\\n    && addgroup clab frr \\\n    && addgroup clab frrvty \\\n    && echo \"clab:${LAB_PASSWORD}\" | chpasswd\n\n\
    COPY entrypoint.sh /usr/local/bin/lab-entrypoint.sh\nRUN chmod +x /usr/local/bin/lab-entrypoint.sh\n\nENTRYPOINT [\"/usr/local/bin/lab-entrypoint.sh\"\
    ]\n"
- flow: 'Lab: Provision and tear down demo datacenter'
  filename: entrypoint.sh
  content: '#!/bin/sh

    # SPDX-FileCopyrightText: 2025-2026 Jakub Trávník <jakub.travnik@gmail.com>

    # SPDX-License-Identifier: AGPL-3.0-or-later

    #

    # Start the SSH server, then hand off to FRR''s normal container entrypoint so

    # zebra/ospfd come up exactly as in the stock image.

    set -e

    /usr/sbin/sshd

    exec /sbin/tini -- /usr/lib/frr/docker-start

    '
- flow: 'Lab: Provision and tear down demo datacenter'
  filename: host/Dockerfile
  content: "# SPDX-FileCopyrightText: 2025-2026 Jakub Trávník <jakub.travnik@gmail.com>\n# SPDX-License-Identifier: AGPL-3.0-or-later\n\
    #\n# Lightweight Linux endpoint for the Meridian lab: an Alpine host with sshd so\n# Hegemony's shell.execute handler\
    \ can log in like to any server, plus\n# iproute2/iputils for end-to-end reachability tests across the routed fabric.\n\
    # ping gets cap_net_raw so the non-root login can run it.\n#\n# python3 + passwordless sudo make the host a first-class\
    \ Ansible managed node\n# for the \"IaC: Ansible server baseline rollout\" flow: ansible modules need a\n# python interpreter\
    \ on the target, and the baseline playbook escalates with\n# become to write under /etc — the same shape as a real server\
    \ fleet's\n# automation account.\n#\n# Built locally by \"Lab: Provision and tear down demo datacenter\" and\n# referenced\
    \ from topology.clab.yml as image \"meridian/lab-host:latest\".\nFROM alpine:3.22\n\n# The login password is injected\
    \ at build time from the meridian-lab-ssh vault\n# secret (same credential the git inventory provider hands to the routers).\n\
    ARG LAB_PASSWORD=demo-lab-password\n\nRUN apk add --no-cache openssh iproute2 iputils libcap-utils python3 sudo \\\n \
    \   && ssh-keygen -A \\\n    && sed -i 's/^#\\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config\
    \ \\\n    && sed -i 's/^#\\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config \\\n    && adduser -D -s /bin/sh\
    \ clab \\\n    && echo \"clab:${LAB_PASSWORD}\" | chpasswd \\\n    && echo \"clab ALL=(ALL) NOPASSWD: ALL\" > /etc/sudoers.d/clab\
    \ \\\n    && chmod 0440 /etc/sudoers.d/clab \\\n    && setcap cap_net_raw+ep \"$(command -v ping)\"\n\nCOPY entrypoint.sh\
    \ /usr/local/bin/host-entrypoint.sh\nRUN chmod +x /usr/local/bin/host-entrypoint.sh\n\nENTRYPOINT [\"/usr/local/bin/host-entrypoint.sh\"\
    ]\n"
- flow: 'Lab: Provision and tear down demo datacenter'
  filename: host/entrypoint.sh
  content: '#!/bin/sh

    # SPDX-FileCopyrightText: 2025-2026 Jakub Trávník <jakub.travnik@gmail.com>

    # SPDX-License-Identifier: AGPL-3.0-or-later

    #

    # Start the SSH server and idle. LAN addressing and routes are applied by

    # containerlab exec directives in topology.clab.yml after the links exist.

    set -e

    /usr/sbin/sshd

    exec sleep infinity

    '
- flow: 'Lab: Provision and tear down demo datacenter'
  filename: topology.clab.yml
  content: "# SPDX-FileCopyrightText: 2025-2026 Jakub Trávník <jakub.travnik@gmail.com>\n# SPDX-License-Identifier: AGPL-3.0-or-later\n\
    #\n# Meridian virtual lab: eleven FRR routers and four Linux endpoint hosts across\n# four lab sites running multi-area\
    \ OSPF.\n#\n#   dc1 (area 1): dc1-core-01/02 are ABRs on the area-0 backbone; two access\n#                 routers are\
    \ dual-homed to both cores; dc1-srv-01 hangs off\n#                 dc1-acc-01 on LAN 10.101.1.0/24.\n#   dc2 (area 4):\
    \ dc2-core-01/02 ABRs, meshed to dc1 over the backbone and\n#                 each connected to one branch; dc2-acc-01\
    \ dual-homed;\n#                 dc2-srv-01 on LAN 10.104.1.0/24.\n#   br1 (area 2): br1-edge-01 ABR homed to dc1-core-01/02\
    \ and dc2-core-01;\n#                 br1-srv-01 on LAN 10.102.1.0/24.\n#   br2 (area 3): br2-edge-01 ABR homed to dc1-core-01/02\
    \ and dc2-core-02;\n#                 br2-srv-01 on LAN 10.103.1.0/24.\n#\n# Endpoint hosts run sshd (image meridian/lab-host)\
    \ so Hegemony's shell.execute\n# reaches them like any server; clab exec directives give them a LAN address\n# and a 10.0.0.0/8\
    \ route via their access router (management stays on eth0).\n#\n# Static management addresses (172.20.30.0/24) so the\
    \ seeded Git inventory can\n# target every node by mgmt_host:\n#   dc1: .11-.15   br1: .21-.23   br2: .31-.33   dc2: .41-.44\n\
    #\n# The __HEGEMONY_CLAB_*__ placeholders are substituted by the Bootstrap flow at\n# deploy time so the bind sources\
    \ resolve identically inside the orchestrator\n# container and on the host Docker daemon that creates the node containers.\n\
    name: __HEGEMONY_CLAB_NAME__\n\nmgmt:\n  network: meridian-lab-mgmt\n  ipv4-subnet: 172.20.30.0/24\n\ntopology:\n  kinds:\n\
    \    linux:\n      image: meridian/frr-lab:latest\n      # Shared FRR daemons file (zebra + ospfd); per-router frr.conf\
    \ is bound\n      # per node below. Endpoint hosts override the image and carry no binds.\n      binds:\n        - __HEGEMONY_CLAB_WORKDIR__/frr/daemons:/etc/frr/daemons\n\
    \        - __HEGEMONY_CLAB_WORKDIR__/frr/vtysh.conf:/etc/frr/vtysh.conf\n  nodes:\n    # ── dc1 ──────────────────────────────────────────────────────────────\n\
    \    dc1-core-01:\n      kind: linux\n      mgmt-ipv4: 172.20.30.11\n      binds:\n        - __HEGEMONY_CLAB_WORKDIR__/frr/dc1-core-01.conf:/etc/frr/frr.conf\n\
    \    dc1-core-02:\n      kind: linux\n      mgmt-ipv4: 172.20.30.12\n      binds:\n        - __HEGEMONY_CLAB_WORKDIR__/frr/dc1-core-02.conf:/etc/frr/frr.conf\n\
    \    dc1-acc-01:\n      kind: linux\n      mgmt-ipv4: 172.20.30.13\n      binds:\n        - __HEGEMONY_CLAB_WORKDIR__/frr/dc1-acc-01.conf:/etc/frr/frr.conf\n\
    \    dc1-acc-02:\n      kind: linux\n      mgmt-ipv4: 172.20.30.14\n      binds:\n        - __HEGEMONY_CLAB_WORKDIR__/frr/dc1-acc-02.conf:/etc/frr/frr.conf\n\
