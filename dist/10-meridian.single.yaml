webhooks:
- name: 'Meridian Webhook: GitOps drift detected'
  description: Synthetic GitOps drift event that triggers a configuration backup.
  flows:
  - 'Ops: Backup lab configs to Git'
  auth_mode: bearer
  replay_window_seconds: 0
  rate_limit_per_minute: 20
  allowed_source_ips:
  - 203.0.113.0/24
  payload_mapping:
    run_name: $.repository.full_name
    params:
      change_id: $.change.id
      source: gitops
  enabled: true
- name: 'Meridian Webhook: Monitoring alarm'
  description: Synthetic monitoring alarm that triggers a routing health check.
  flows:
  - 'Net: Lab routing health check'
  auth_mode: hmac_sha256
  replay_window_seconds: 300
  rate_limit_per_minute: 60
  allowed_source_ips:
  - 192.0.2.0/24
  payload_mapping:
    run_name: $.alarm.name
    params:
      alarm: $.alarm.name
      severity: $.alarm.severity
      source: monitoring
  enabled: true
- name: 'Meridian Webhook: ITSM change window'
  description: Synthetic ITSM change-window event that triggers a service prefix announcement.
  flows:
  - 'Ops: Announce service prefix'
  auth_mode: hmac_sha256
  replay_window_seconds: 600
  rate_limit_per_minute: 15
  allowed_source_ips:
  - 192.0.2.0/24
  - 198.51.100.0/24
  payload_mapping:
    run_name: $.number
    params:
      change_id: $.number
      service_address: $.change.service_address
      source: itsm
  enabled: true
flow_subscriptions:
- flow: 'Ops: Backup lab configs to Git'
  destination: Meridian NOC Email
  event: run.completed
  enabled: true
- flow: 'Ops: Backup lab configs to Git'
  destination: Meridian NOC Email
  event: run.failed
  enabled: true
- flow: 'Ops: Announce service prefix'
  destination: Meridian NOC Email
  event: approval.requested
  enabled: true
- flow: 'Ops: Announce service prefix'
  destination: Meridian NOC Email
  event: run.completed
  enabled: true
- flow: 'Ops: Announce service prefix'
  destination: Meridian Slack
  event: run.completed
  enabled: false
- flow: 'Net: Lab routing health check'
  destination: Meridian Security Email
  event: run.failed
  enabled: true
- flow: 'Net: End-to-end reachability test'
  destination: Meridian Security Email
  event: run.failed
  enabled: true
- flow: 'Net: Lab routing health check'
  destination: 'Meridian Webhook: Signed HMAC'
  event: run.failed
  enabled: false
- flow: 'Lab: Provision and tear down demo datacenter'
  destination: Meridian NOC Email
  event: approval.requested
  enabled: true
platform_sync_profiles:
- name: Meridian platform config backup
  description: Export Meridian's platform configuration (everything except flows, which are versioned to flow-backups) to
    the platform-backups Gitea repository.
  mode: backup
  git_repository: platform-backups
  branch: main
  base_path: platform
  enabled: true
  schedule_enabled: false
  excluded_families:
  - flow
  - flow_notification_subscription
  destructive_policy: block
  auto_apply_non_destructive: false
